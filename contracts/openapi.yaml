# Story-Tail Adventures — API contract
#
# Source of truth for every endpoint served at /functions/v1/{name}: today by the Supabase
# Edge Functions in `supabase/functions/`, and, as each one is ported (docs/GO-MIGRATION.md
# §5), by the Go service in `webgo/`, which answers byte for byte the same requests, replies
# and problem+json errors. A ported path keeps its entry unchanged. Both clients consume
# generated types from this file:
#   - TypeScript  → contracts/ts/types.ts   (npm run generate -w contracts)
#   - Kotlin      → contracts/kotlin/       (npm run generate -w contracts)
#
# Do not hand-write API response types in `web/` or `mobile/`. Generate them.
#
# P1 note: Screen 2.1.1 Login and the rest of the 2.1.x auth flow call Supabase
# Auth (GoTrue) directly via the official SDKs, so they are deliberately NOT
# described here — GoTrue is not our surface.
#
# Reads are not described here either. The §2.2 screens read the trip graph
# through PostgREST under RLS, and the column grants in
# 20260907031255_trip_read_policies.sql ARE the read contract; restating them as
# endpoints would create a second source of truth for the same question.
#
# The five `onboarding-*` functions predated this file and were backfilled in
# September 2026. They are described below §2.2's writes.
#
# One convention worth knowing before reading them: EVERY field on every
# onboarding request is optional, and ABSENT is not the same as NULL. Absent
# means "leave this alone"; explicit null means "clear it". That tri-state is
# what makes "Skip for now" work — it posts `{}` — and it is why none of the
# request schemas below carry a `required` list.

openapi: 3.1.0

info:
  title: Story-Tail Adventures API
  version: 0.0.1
  description: |
    Edge Function API for the Story-Tail Adventures CRM platform.

    All money is transported as an integer number of minor units (cents) in a
    JSON *string*, paired with an ISO-4217 `currency` code. Never as a JSON
    number — values above 2^53 lose precision silently. See CLAUDE.md rule 5.

    All identifiers are UUID v7 (time-ordered). See docs/Data-Model.md §21.6.
  license:
    name: UNLICENSED

servers:
  - url: http://127.0.0.1:54321/functions/v1
    description: Local Supabase
  - url: https://{projectRef}.supabase.co/functions/v1
    description: Hosted Supabase
    variables:
      projectRef:
        default: localhost

security:
  - supabaseJwt: []

paths:
  # ───────────────────────────────────────────────────────────────────────────
  # §2.2 Dashboard & Trip Experience
  #
  # Reads are NOT here, deliberately. Every §2.2 screen reads the trip graph through
  # PostgREST under the RLS policies in 20260907031255_trip_read_policies.sql, naming its
  # columns — the grants are the contract for reads, and duplicating them as endpoints
  # would give two sources of truth for the same question. Only writes and the one
  # capability a client cannot be granted (naming a storage object) are functions.
  # ───────────────────────────────────────────────────────────────────────────

  # ───────────────────────────────────────────────────────────────────────────
  # §2.0 Public hotel search
  # ───────────────────────────────────────────────────────────────────────────

  /hotel-search:
    post:
      operationId: searchHotels
      summary: Live hotel search for the public Explore surface.
      deprecated: true
      description: |
        RETIRED, NOT PORTED (2026-11-06). Nothing calls this function any more: the web app
        does live hotel search itself since PR #48 (`web/lib/public/hotels.ts`), and mobile
        never called it. It is not ported to Go and goes away with the Deno functions
        (docs/GO-MIGRATION.md §5.10). The description below is kept as the record.

        Screen 2.0.4 in Hotels mode, and 2.3.3 later. Calls SerpApi's Google Hotels engine
        for the dates given and returns normalised hotel content plus ONE indicative
        nightly rate per property.

        NOT CALLED FROM A BROWSER. The caller is the Next.js server
        (`web/lib/public/hotels.ts`), presenting the project anon key plus the server-only
        `X-STA-Search-Token`. `verify_jwt` stays true and there is no anon RLS policy
        anywhere: this function is the boundary, not a table. The anon key is public — it
        ships in the browser bundle — so it authenticates nobody, which is what the header
        is for.

        THE RESPONSE CARRIES NO BOOKING-SITE IDENTITY. The provider's
        `properties[].prices[]` — site names, their logos, their links — is dropped at the
        mapper and has no field to land in here. Free-Travel-APIs §1.3.5 forbids promoting
        another business on this site; §10.2 asks for that to be structural rather than
        remembered. See `HotelRate`, which is one scalar rather than a list, for why.

        DEGRADATION IS A 200. When the monthly budget is spent the response carries
        `degraded: "budget_exhausted"` with empty `results`, and the page falls back to the
        curated catalog. Late in a month on the free tier that is the expected outcome, not
        a failure. `source: "stale"` means the budget is spent but a recent expired cache
        entry was served — `staleAsOf` says how old, and the page must say so.

        POST rather than GET so the filter arrays cannot be serialised two ways by two
        callers, which is the cache-key hazard the whole design is built around.
      parameters:
        - name: X-STA-Search-Token
          in: header
          required: true
          description: Shared secret proving the caller is our own server.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HotelSearchRequest'
      responses:
        '200':
          description: Results — live, cached, stale, or degraded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HotelSearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ───────────────────────────────────────────────────────────────────────────
  # §2.0 Public cruise search
  # ───────────────────────────────────────────────────────────────────────────

  /cruise-search:
    post:
      operationId: searchCruises
      summary: Public read of the synced cruise catalog.
      description: |
        Screen 2.0.4 in Cruises mode, and 2.3.4 later. Reads sailings we have already
        synced; it calls no provider and spends nothing.

        WHY A FUNCTION FOR DATA ALREADY IN OUR DATABASE. `hotel-search` exists because
        hotels are a live third-party proxy with no table. This one exists for a narrower
        reason: `supabase/tests/rls_cruise_catalog.sql` asserts that NOBODY — not anon, not
        authenticated — holds any grant on any cruise table. That is a stronger invariant
        than an `anon` SELECT policy gated on a published flag would leave behind, and
        reading here on the service role is what keeps it.

        NOT CALLED FROM A BROWSER. The caller is the Next.js server
        (`web/lib/public/cruises.ts`), presenting the project anon key plus the server-only
        `X-STA-Search-Token` — the same credential `hotel-search` uses, from the same
        `HOTEL_SEARCH_CALLER_TOKEN` secret. The anon key ships in the browser bundle, so it
        authenticates nobody; the header is what does.

        PORTED TO GO (2026-11-06). The Go service runs it IN PROCESS for its own web pages
        and answers 404 on its HTTP door, so no caller token is needed or accepted there; the
        request and reply below are unchanged. The `X-STA-Search-Token` header applies only to
        the Deno function, until it is retired (GO-MIGRATION.md §5.10).

        THE RESPONSE CARRIES NO FARE. `cruise_sailing.lead_price_cents` exists and is
        classified Internal (Data-Model §24.4); Free-Travel-APIs §4.7 says to launch the
        public surface without it, because a fare re-opens §1.3.4 and §9.2 and goes stale on
        a page nobody is watching. It is not selected, and `PublicSailing` has no field for
        it — the structural technique `HotelRate` uses against booking-site identity.

        NO BUDGET, NO LEDGER, NO RATE LIMITER, and no `degraded` state to report: one
        indexed query against our own Postgres cannot exhaust anything. The metered call in
        this domain is `cruise-sync`.

        SHIP PHOTOGRAPHY IS CURATED, NOT SYNCED. `shipImage` comes from four editorial
        columns on `cruise_ship` (Data-Model §24.2) written by migration from Wikimedia
        Commons — track.cruises carries no imagery, and Free-Travel-APIs §4.8 measured the
        provider's `/ships` scope as unaffordable. The photos are CC BY / CC BY-SA, so
        `credit` is required rather than nullable and MUST be displayed wherever the image
        is. See `ShipImage`.
      parameters:
        - name: X-STA-Search-Token
          in: header
          required: true
          description: Shared secret proving the caller is our own server.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CruiseSearchRequest'
      responses:
        '200':
          description: Matching sailings, soonest departure first. An empty list is normal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CruiseSearchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /trip-message:
    post:
      operationId: sendTripMessage
      summary: Post a message into a thread.
      description: |
        Screens 2.2.7, 2.6.2 and 2.6.3. `message` has SELECT-only RLS and no write policy,
        so a PostgREST insert would match zero rows and return 204 — looking like it worked
        and changing nothing.

        Address the thread ONE of three ways: `tripId` for a trip thread, `conversationId`
        for an existing thread (which may have no trip), or neither for the general thread,
        which is found or created against `trip_id IS NULL`. Sending both ids is a 400
        rather than a silent preference — they can disagree.

        The function refuses if the caller does not own the trip or conversation, writes the
        message and any attachment rows, denormalizes the conversation row, and writes an
        `audit_event` (CLAUDE.md rule 3).

        NOT ATOMIC. The message insert, the attachment rows and the conversation update are
        separate round trips on the service role; a failure between them can leave a stale
        preview or an attachment-less message. The implementation says so at the top of
        `supabase/functions/trip-message/index.ts` and names the fix (one Postgres function
        over RPC, together with the audit-transaction work). This description previously
        claimed the writes were "in one transaction", which was never true.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendTripMessageRequest'
      responses:
        '201':
          description: The message was posted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendTripMessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /trip-document:
    post:
      operationId: requestTripDocumentUpload
      summary: Register a document and get a short-lived upload URL for it.
      description: |
        Screens 2.2.6 and 2.2.11. Two things have to happen together: a `document` row has
        to exist, and an object has to land in the private `trip-documents` bucket. The
        client can do neither directly — it has no write policy on `document` and is never
        granted `storage_key` — so the function creates the row, signs an upload URL for a
        key the client never chooses, and audits it.

        `kind` is constrained to the kinds a client may contribute. A client cannot create
        a `receipt` or a `csv_import`: those are agency records, and the read policy
        excludes them for the same reason.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestTripDocumentUploadRequest'
      responses:
        '201':
          description: The document row exists and the upload URL is signed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestTripDocumentUploadResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /trip-document-url:
    get:
      operationId: getTripDocumentUrl
      summary: Sign a short-lived read URL for a document the caller owns.
      description: |
        The single door to the `trip-documents` bucket, and the reason the bucket has no
        `authenticated` policies at all: `document.storage_bucket` and `storage_key` are
        outside the client column grant, so a client can never name an object and could
        never reach a storage policy even if one existed.

        This is not a web-only convenience. A Compose Multiplatform app has no server, so
        without this endpoint Screens 2.2.6 and 2.2.11 cannot open a file on Android or iOS
        at all.

        Ownership is re-checked against the same predicate `document_self_select` uses,
        including the `kind` allowlist, and every signature is written to `audit_event`.
      parameters:
        - name: documentId
          in: query
          required: true
          description: A `document.id` the caller can already read.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: A signed URL, valid for a few minutes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripDocumentUrlResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /testimonial:
    post:
      operationId: saveTestimonial
      summary: Save or submit a reflection on a trip.
      description: |
        Screen 2.2.11. `testimonial` has no client write policy because a direct insert
        would carry no `audit_event`, and because the draft-to-submitted transition needs
        validating somewhere the client cannot reach.

        A client may only ever reach `draft` and `submitted`. Approval and publication are
        agent actions and land with §3.x — the CHECK constraints on the table enforce that
        nothing is published without an approval, so a bug here fails loudly.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveTestimonialRequest'
      responses:
        '200':
          description: The reflection was saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaveTestimonialResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── §3.2 Agent worklist ────────────────────────────────────────────────
  #
  # The first agent-side endpoint, and the first writer of `trip` anywhere. Agent
  # READS are not described here, for the same reason §2.2's are not: they go
  # through `public.agent_*()` SECURITY DEFINER accessors whose RETURNS TABLE
  # signatures ARE the read contract, and restating them would create a second
  # source of truth. `contracts/` describes the write.

  /agent-trip-status:
    post:
      operationId: setAgentTripStatus
      summary: Move a trip between pipeline stages.
      description: |
        `op: bulk` moves many trips at once, each guarded by the status its row was
        showing; a trip moved since, not this advisor's, or already there is skipped, and
        the skipped ones are indistinguishable. Bulk refuses `cancelled` (400).

        Screen 3.2.2 (Pipeline / Funnel View). Agent role only — a traveler gets a 403
        naming the other side of the platform, and so does an advisor whose `agent.status`
        is `archived`. Every read on this side already refuses that advisor
        (`current_agent_id()` tests `status <> 'archived'`); a write path that did not
        would leave an offboarded advisor moving trips they can no longer see, which is
        an empty board that looks like enforcement next to an open door. `inactive` is
        not `archived` — a paused advisor still works the book they hold.

        THE MUTATION IS ATOMIC IN SQL, not here. A stage change is a `trip` update plus a
        `trip_status_history` row, and `public.agent_set_trip_status` does the pair under
        `FOR UPDATE`. Losing the history row is unrecoverable: `trip.status_changed_at`
        keeps only the LATEST transition, so a transition without its history row leaves
        nothing to reconstruct the timing from and the inquiry-to-book KPI is wrong
        permanently. The `audit_event` is written after, in TypeScript, because it carries
        the IP and user agent that only exist at the HTTP layer.

        `expectedVersion` IS REQUIRED. `trip.version` has existed since the initial
        migration and nothing had ever honoured it (Data-Model §20.4); a drag-and-drop
        board with two tabs open is exactly what it is for. A mismatch is a **409**, not a
        400 — the caller did nothing wrong, the row moved under them, and a reload fixes
        it. Omitting the field is a 400: the board always has a version in hand, and
        allowing it to be left out would quietly make every drop last-write-wins.

        A NO-OP IS A 200, NOT AN ERROR. Dropping a card back into its own column asks for
        a state that already holds. `changed` is false and NO history row is written — a
        logged transition that never happened corrupts the cycle-time KPI exactly as
        badly as a missing one.

        ONE SAME-STAGE CALL STILL WRITES: `cancelled` → `cancelled` carrying a DIFFERENT
        reason. This endpoint is the only writer of `trip.cancellation_reason` in the
        schema, and the call that makes the reason mandatory used to take it, answer 200
        and drop it. The reason now lands, and an `audit_event` is written under
        `trip.cancellation_reason_changed` rather than under a status change that did not
        happen. `changed` stays false, because no stage moved and no history row was
        written — so `changed: false` does NOT promise that nothing was recorded.
        `cancellationReasonUpdated` is what tells the two apart, and it is present on
        every `cancelled` call.

        `cancellationReason` IS REQUIRED WHEN `status` IS `cancelled`. It lands in
        `trip.cancellation_reason`, which is inside the client column grant and which
        Screen 2.2.10 renders. A cancellation that cannot tell the traveler why is a worse
        row than no cancellation. A later non-cancel transition does not clear it.

        THE STATUS SET IS THE `trip_status` ENUM, all six values. The board draws five of
        them; `cancelled` is a real destination but not a funnel column. The design
        prototype draws `Qualified` and `Traveling`, neither of which exists in the enum —
        recorded as a prototype defect rather than chased with a migration.

        WHAT IT DOES NOT DO: it does not create a commission row, touch payment milestones,
        or send anything. Marking a trip `booked` is what §3.7's commission entry hangs
        off, but minting money records as a side effect of a drag is §3.7.4's job to do
        deliberately.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/AgentTripStatusRequest'
                - $ref: '#/components/schemas/AgentTripStatusBulkRequest'
      responses:
        '200':
          description: |
            The trip is in the requested stage. `changed` is false when it already was.
            On a `cancelled` call, `cancellationReasonUpdated` says whether the reason
            reached `trip.cancellation_reason`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AgentTripStatusResponse'
                  - $ref: '#/components/schemas/AgentTripStatusBulkResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /agent-trip-notes:
    post:
      operationId: setAgentTripNotes
      summary: Edit a trip's agent-only notes.
      description: |
        Screen 3.4.2 (Trip Detail, Notes tab). Same optimistic-concurrency shape as
        `/agent-trip-status` against `trip.version`, and the same agent-only,
        archived-advisor-refused access rule. No `trip_status_history` row — unlike
        a stage change, there is no history table a free-text edit could corrupt by
        losing a row to it, so the only outcomes are `changed` and a no-op.

        `expectedVersion` IS REQUIRED, for the same reason as the stage write: two
        tabs open on the same trip is exactly what `trip.version` is for. A
        mismatch is a 409, not a 400 — the row moved under the caller, and a
        reload is the fix.

        `notes` MUST BE A STRING. An empty string clears the field; sending
        anything else is a 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentTripNotesRequest'
      responses:
        '200':
          description: The notes are saved. `changed` is false when nothing was different.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentTripNotesResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /agent-message:
    post:
      operationId: agentMessage
      summary: The advisor's messaging writes. Send, mark read, archive.
      description: |
        Screens 3.10.1 and 3.10.2 (§3.10 Stage 1 on the web; Stage 3 on the phone). ONE
        endpoint with three ops, chosen by `op`, each its own request and response shape.

        `send` writes a reply or an internal note (`internalNote` is REQUIRED, never
        defaulted: a missing flag read as "public" would send a private note to the client).
        Address an existing thread by `conversationId`, OR a client (and optionally one of
        their trips) by `clientId` / `tripId`, which finds their live thread or starts one.
        Never both. A thread cannot START with a note. A body that still holds a known
        `{{merge.field}}` from a template is refused. One SQL transaction, so a note never
        moves the client's preview, time or unread count.

        `read` clears the advisor's unread count up to `seenUpTo`, the `created_at` of the
        newest message on screen, passed as the raw string (microseconds intact).

        `archive` files threads in the ADVISOR's inbox only; the client keeps the thread, and
        their next message brings it back.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/AgentSendMessageRequest'
                - $ref: '#/components/schemas/AgentMarkThreadReadRequest'
                - $ref: '#/components/schemas/AgentArchiveThreadsRequest'
      responses:
        '200':
          description: "`read`: whether the count moved. `archive`: how many threads moved."
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AgentMarkThreadReadResponse'
                  - $ref: '#/components/schemas/AgentArchiveThreadsResponse'
        '201':
          description: "`send`: the message was written."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSendMessageResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /push-device:
    post:
      operationId: pushDevice
      summary: Turn this device's message notifications on or off.
      description: |
        Screen 3.10.7 (§3.10 Stage 3b). `register` is the inbox card's "Turn on": a browser
        sends its Web Push subscription, an Android phone its FCM token. Advisors only; an
        archived advisor is refused. The device is keyed on its address, so registering again
        refreshes the row, and an address another user held moves to the caller.

        `unregister` is sign-out: only the caller's own row for that address goes. It needs a
        signed-in caller, not an active advisor.

        Device addresses are identifiers and are never returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/PushRegisterRequest'
                - $ref: '#/components/schemas/PushUnregisterRequest'
      responses:
        '200':
          description: What happened. Never an address.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushDeviceResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /onboarding-step:
    post:
      operationId: setOnboardingStep
      summary: Move the wizard cursor, or mark onboarding complete.
      description: |
        Screens 2.1.9 – 2.1.14. Writes `platform_user.onboarding_step`, or
        `onboarding_completed_at` when `complete` is true.

        Send EITHER a known `step` OR `complete: true`. Anything else is a 400 —
        an unrecognised step would silently strand somebody mid-wizard.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingStepRequest'
      responses:
        '200':
          description: The cursor moved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingStepResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /onboarding-profile:
    post:
      operationId: saveOnboardingProfile
      summary: Save the traveler's own details. Screen 2.1.10.
      description: |
        Writes `client` (phone, date of birth, emergency contact), `address` and
        the traveler's own `travel_document` row. Audited as `client.updated`.

        THE PASSPORT NUMBER IS NOT ACCEPTED. `travel_document.document_number_encrypted`
        is Sensitive PII that Data-Model §18.2 requires be encrypted under a
        backend-held DEK, and none of that is built — collecting a number in
        order to store it unprotected is worse than not collecting it. Sending
        `passport.number` is a 400 rather than being ignored, so a caller learns
        it was not stored instead of discovering later that it never was.

        The mailing address is six structured fields, not one line: there is no
        free-text address column anywhere in the schema, and `line1`, `city` and
        `country` are NOT NULL together or absent together.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingProfileRequest'
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingOkResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /onboarding-preferences:
    post:
      operationId: saveOnboardingPreferences
      summary: Save travel preferences. Screen 2.1.11.
      description: |
        Writes one `travel_preference` row per client. Every list is validated
        against the vocabulary in Data-Model §6.2; a value outside it is a 400.

        `dietary` and `accessibility` treat `none` as EXCLUSIVE — "none" plus
        something else is a contradiction and is refused rather than silently
        resolved.

        The budget is one of four bands, not a number. Two slider thumbs would
        be two numbers plus a currency (CLAUDE.md rule 5) to capture a figure
        the traveler is guessing at, and the bands match `lead.budget_band` so a
        Phase 2 lead converts without translation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingPreferencesRequest'
      responses:
        '200':
          description: Saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingIdResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /onboarding-companions:
    post:
      operationId: saveOnboardingCompanion
      summary: Add, edit or remove a travel companion. Screen 2.1.12.
      description: |
        One companion per call, chosen by `action`. `none` writes nothing and
        exists so "Save & continue" with an already-complete list can advance
        the cursor without inventing a row.

        `remove` is a soft delete. A companion who has travelled is referenced
        by trip history, and a hard delete would take that with them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingCompanionRequest'
      responses:
        '200':
          description: Saved. `id` is null when `action` was `none`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingIdResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: An `edit` of a companion who is not on the caller's list ("That companion is not on your list.").
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /onboarding-connect:
    post:
      operationId: redeemConnectCode
      summary: Redeem an agent's invite code, or decline to. Screen 2.1.13.
      description: |
        Links the traveler to the agent who invited them. Audited on both the
        success and the refusal paths — a burst of guesses has to be countable,
        which is why a failed attempt is recorded BEFORE the refusal is returned.

        Omitting `code` (or sending null) is a first-class exit: "I don't have a
        code" writes nothing but the cursor and returns `redeemed: false`.

        Every refusal carries a `detail` naming the reason. A refused CODE is a 400
        (unknown, expired, already used, revoked, already connected, claimed by
        another traveler); the rate limit, and a caller who is not a traveler, are
        403. The reason is deliberately specific: a traveler holding a code that
        expired needs to know that, not "invalid code". (Corrected 2026-11-06: this
        used to say every refusal was a 403; the differential test against the
        function showed otherwise.)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingConnectRequest'
      responses:
        '200':
          description: Redeemed, or declined without error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingConnectResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: |
            Too many attempts, or the caller is not a traveler. `detail` names
            which. A refused code is a 400.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  # ───────────────────────────────────────────────────────────────────────────
  # §3.8 Leads (P2)
  # ───────────────────────────────────────────────────────────────────────────

  /lead-message:
    post:
      operationId: sendLeadMessage
      summary: The public "Message Gyasi" form, for a visitor with no account.
      security: []
      description: |
        Screen Inventory 2.0.12. NO SIGN-IN: a visitor who only messages Gyasi is a lead
        (BRD §6.5, 2026-10-21); whoever asks for a quote is a client and uses `/quote-request`.

        THE ANSWER NEVER SAYS WHAT HAPPENED. A new lead, a message joining an open lead, and
        an address that already belongs to a client all answer `{ "ok": true }`, so the form
        cannot be used to learn whether an address is a client's. A send that looks automated
        (the hidden `website` field filled, or sent under three seconds after `startedAt`) is
        dropped and answered the same way.

        A card number anywhere in the message is REFUSED (400), never stored or masked
        (CLAUDE.md rule 1). Five sends an hour per network address, then 429. 503 when there
        is not exactly one active advisor to route to (ours to fix, not the visitor's).

        In the Go service the web form calls this in process; the visitor's address comes
        from the server, never from a header the caller sent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeadMessageRequest'
      responses:
        '200':
          description: Received (whatever happened to it).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OkResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '429':
          description: Five sends an hour from this address. `detail` is "Please try again a little later."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: No single active advisor to route to. `detail` is "Messages can't be sent just now. Please try again later."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /agent-lead:
    post:
      operationId: agentLead
      summary: The advisor's lead actions (3.8.4 and 3.8.5).
      description: |
        One function, six `op`s. `create` adds a lead by hand (3.8.5); the rest act on an
        existing lead of the caller's: `mark_contacted`, `close` (with a `reason` from the list
        and an optional private `note`), `reopen`, `convert` (to one of the caller's clients),
        and `delete_spam`. Every write is audited (`lead.created`, `lead.note_added`,
        `lead.contacted`, `lead.closed`, `lead.reopened`, `lead.converted`,
        `lead.deleted_as_spam`); a `noop` is not.

        Advisor only (agent role, a second factor this session, not archived). A lead that is
        not the caller's, or a `convert` to a client that is not theirs, is 404 "No such lead.".
        409 when the lead moved since the page loaded, or (`reopen`) when the address already
        has another open lead.

        `create` answers `client_exists` with the client's id when the address is already a
        client of theirs; nothing is written then.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentLeadRequest'
      responses:
        '200':
          description: The outcome. `create` answers its own shape; the other ops answer `AgentLeadWriteResponse`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AgentLeadCreateResponse'
                  - $ref: '#/components/schemas/AgentLeadWriteResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ───────────────────────────────────────────────────────────────────────────
  # §2.3 Quote requests (P2)
  # ───────────────────────────────────────────────────────────────────────────

  /quote-request:
    post:
      operationId: requestQuote
      summary: Turn a search result into a trip in `inquiry` status.
      description: |
        Screens 2.3.8 and 2.0.4 (P2). A quote request is a TRIP, not a lead (BRD §6.5,
        decided 2026-09-09): the trip is created with its default status `inquiry`, and one
        `trip_component` describes what the traveler was looking at. A signed-in CLIENT only
        (`trip.client_id` and the client's names are NOT NULL, so there is no anonymous
        path); an advisor or admin is 403 "Requires role: client.".

        `tripId` is minted by the client (a recent UUID v7), which makes a retry land once:
        a second send of the same id is 400 "That request has already been sent.". The
        advisor is read from the caller's client record, never from the request.

        MONEY STAYS ZERO. A provider's nightly rate is not a quote: the component's
        `cost_cents` and `commission_cents` keep their zero defaults, and the figure rides in
        `trip_component.payload` as `snapshot.indicativeRateCents`.

        The component is best effort: if its insert fails the trip still stands (201), and
        the `trip.inquiry_created` audit row records `componentWritten: false`. The advisor is
        then alerted (push and/or email, by their settings); a failed alert never fails the
        request.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequestRequest'
      responses:
        '201':
          description: The trip exists, in `inquiry`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteRequestResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: The caller has no client record. `detail` is "No client record for this account."
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  # ───────────────────────────────────────────────────────────────────────────
  # §3.4 Trip Builder and itinerary (agent-trip, agent-itinerary)
  # ───────────────────────────────────────────────────────────────────────────

  /agent-trip:
    post:
      operationId: agentTrip
      summary: The trip builder's writes. Create, components, the payment schedule, pay links.
      description: |
        Screens 3.4.3 (create), 3.4.4 to 3.4.12 (components), 3.4.15 (payment schedule) and
        3.6.1 (pay links). ONE endpoint with eight ops, chosen by `op`, each its own request
        and response shape. Agent role only, at aal2; an advisor whose `agent.status` is
        `archived` is refused (403). A traveler gets 403 on every op: only the advisor
        writes a pay link or marks a milestone paid (BRD §10).

        Every op but `create` names `tripId`. A trip that is not this advisor's, is
        archived or does not exist is ONE answer, 404 "That trip is not on your board.",
        and so is a component or milestone that is not on that trip.

        `create` mints the trip id (v7) and answers `{outcome: created, tripId}`, or
        `{outcome: no_client}` with a 200 when the client is not this advisor's.
        `travelerCount` is clamped to 1..64, not refused; a non-integer is 1.

        `component_upsert` creates (no `componentId`) or edits. Unknown `detail` keys are
        refused, never dropped. Cents are a JSON integer or a digit string (at most ten
        digits). `commissionCents` left blank with a rate set is worked out from the rate;
        anything typed, 0 included, wins. A save that changes nothing answers `noop`.
        `component_archive` is soft. `component_reorder` sends EVERY live component in its
        new order; a list that does not cover the trip is a 409.

        `payment_upsert` creates or edits a milestone's kind, label, amount and due date.
        `payment_paid` is the only op that moves what the client has paid: `paidCents`
        absent means the whole amount, 0 means nothing landed; `paidReference` and
        `paidNote` absent keep what is stored and "" clears them; `paidOn` may not be after
        the advisor's today. `payment_delete` is a hard delete.

        `payment_link` sets, changes or removes (null, "" or absent) the milestone's pay
        link. NO CARD NUMBERS, EVER: a link, confirmation number or note holding a
        Luhn-valid 13 to 19 digit run is a 400. A link must be `https://`, carry no user
        name or password, and name a real host (not an IP, not `localhost`); it is stored
        as parsed (`payUrl` in the reply is what was stored: host lower-cased, IDN in
        punycode). A link the database CHECK still refuses is a 400 too. Every set, change
        and removal, and every paid mark, writes its `audit_event` inside the same SQL
        transaction as the write; a no-op writes none.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/AgentTripCreateRequest'
                - $ref: '#/components/schemas/AgentTripComponentRequest'
                - $ref: '#/components/schemas/AgentTripComponentArchiveRequest'
                - $ref: '#/components/schemas/AgentTripComponentReorderRequest'
                - $ref: '#/components/schemas/AgentTripMilestoneRequest'
                - $ref: '#/components/schemas/AgentTripMilestonePaidRequest'
                - $ref: '#/components/schemas/AgentTripPayLinkRequest'
                - $ref: '#/components/schemas/AgentTripMilestoneDeleteRequest'
      responses:
        '200':
          description: The op's outcome.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AgentTripCreateResponse'
                  - $ref: '#/components/schemas/AgentTripComponentResponse'
                  - $ref: '#/components/schemas/AgentTripReorderResponse'
                  - $ref: '#/components/schemas/AgentTripMilestoneResponse'
                  - $ref: '#/components/schemas/AgentTripMilestonePaidResponse'
                  - $ref: '#/components/schemas/AgentTripPayLinkResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /agent-itinerary:
    post:
      operationId: agentItinerary
      summary: The Itinerary Editor's writes. Generate, a day, an activity, delete, reorder.
      description: |
        Screen 3.4.14. ONE endpoint with five ops, chosen by `op`, each its own request
        and response shape. Agent role only, at aal2, and an advisor whose `agent.status`
        is `archived` is refused (403). Every op names `tripId`; a trip that is not this
        advisor's, is archived, or does not exist is ONE answer, 404 "That trip is not on
        your board.", and so is a day or activity that is not on that trip's itinerary.

        `generate` adds a day for every date from the trip's start to its end, and an
        activity for every live component (insurance excepted) that starts on one of those
        days and is not on the itinerary yet. Additive and idempotent: a second press adds
        nothing, answers `noop`, and writes no audit row. A trip without both dates
        answers 200 with `outcome: no_dates`, not a 4xx, so the screen can say "give the
        trip dates first" next to the dates.

        `day_upsert` creates a day (`date` required) or edits one (`dayId`; a missing
        `date` keeps the stored one). `activity_upsert` creates an activity on `dayId` or
        edits `activityId` (moving it when `dayId` names another day). `block` omitted is
        worked out from `startTime`. Blank text fields are stored as null; `label`,
        `summary` and every activity field are replaced outright on an edit.

        `activity_delete` is a hard delete; its audit row is the only record left.

        `reorder` sends EVERY activity of one day in its new order. A list that does not
        cover the day (it gained or lost an activity since the page rendered) is a 409.
        `moved` counts the activities whose position changed; 0 writes no audit row.

        Audit rows carry the trip id, never the label, summary or activity text.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/AgentItineraryGenerateRequest'
                - $ref: '#/components/schemas/AgentItineraryDayRequest'
                - $ref: '#/components/schemas/AgentItineraryActivityRequest'
                - $ref: '#/components/schemas/AgentItineraryActivityDeleteRequest'
                - $ref: '#/components/schemas/AgentItineraryReorderRequest'
      responses:
        '200':
          description: The op's outcome.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AgentItineraryGenerateResponse'
                  - $ref: '#/components/schemas/AgentItineraryDayResponse'
                  - $ref: '#/components/schemas/AgentItineraryActivityResponse'
                  - $ref: '#/components/schemas/AgentItineraryReorderResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ───────────────────────────────────────────────────────────────────────────
  # §3.3 Clients, §3.5 templates, §3.10 message templates, §3.12 settings
  # ───────────────────────────────────────────────────────────────────────────

  /agent-client:
    post:
      operationId: agentClient
      summary: Create, edit, archive or restore a client, or tag many at once.
      description: |
        Screens 3.3.9 (create), 3.3.10 (edit), 3.3.12 (archive / restore) and 3.3.1's bulk tag.
        ONE endpoint with four ops, chosen by `op`, each its own request shape.

        ONLY A STALE `expectedVersion` IS A 409 (`update`, `archive`). Every other answer is a
        200 with an `outcome`: `duplicate_email` is a 200 so the form can link to the record the
        advisor already has (`create` returns its id as `existingClientId`).

        A client that is not this advisor's, does not exist, or was merged away is a 404 on
        `update` and `archive`. `bulk_tag` reports only how many changed: a client that is not
        this advisor's, already carried the tag, or is at the 20-tag cap is skipped, and the
        three are indistinguishable.

        Audited per client: `client.created` / `client.updated` (the NAMES of the fields that
        moved, never their values) / `client.archived` (with the reason) / `client.restored` /
        `client.tag_added` / `client.tag_removed` (one row per changed client).

        Text fields are trimmed; an empty string is null. Lengths are in UTF-16 units.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/AgentClientCreateRequest'
                - $ref: '#/components/schemas/AgentClientUpdateRequest'
                - $ref: '#/components/schemas/AgentClientArchiveRequest'
                - $ref: '#/components/schemas/AgentClientBulkTagRequest'
      responses:
        '200':
          description: The op's outcome.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AgentClientCreateResponse'
                  - $ref: '#/components/schemas/AgentClientUpdateResponse'
                  - $ref: '#/components/schemas/AgentClientArchiveResponse'
                  - $ref: '#/components/schemas/AgentClientBulkTagResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /agent-client-notes:
    post:
      operationId: agentClientNotes
      summary: Add, edit or delete one of a client's internal notes.
      description: |
        Screen 3.3.7 (Client Detail, Notes tab). `create` mints the note's id (v7) itself;
        `update` and `archive` name an existing note by `noteId`. Delete is an ARCHIVE
        (`client_note.archived_at`). No `expectedVersion`: `client_note` has no version column.

        A client that is not this advisor's, does not exist or was merged away, and a note
        that is not this client's, not this author's or already archived, are all the same
        404. A re-save of identical text is `changed: false`. The audit row
        (`client.note_created` / `client.note_changed` / `client.note_archived`) carries the
        note id, never the note.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentClientNoteRequest'
      responses:
        '200':
          description: "The note was written, or (`changed: false`) already read that way."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentClientNoteResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /agent-template:
    post:
      operationId: agentTemplate
      summary: Trip templates. Save a trip as one, rename it, retire it, or apply it to a trip.
      description: |
        §3.4.13 Trip Template Library. ONE endpoint with four ops, chosen by `op`.

        `save` snapshots a trip of the advisor's (its components and day-by-day, every date
        as an offset from the trip's start; never confirmation numbers or the payment
        schedule). `update` changes the name and description only. `archive` is a soft delete.
        `apply` seeds a trip from a template: components are appended, days the trip already
        has are left alone, and days need the trip to have a start date. A trip seeded once
        answers `already_applied` and nothing is written.

        A trip or template that is not this advisor's, does not exist or is archived is a 404.
        Audited only when something changed: `trip_template.created` / `.updated` / `.archived`
        and `trip.seeded_from_template`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/AgentTemplateSaveRequest'
                - $ref: '#/components/schemas/AgentTemplateUpdateRequest'
                - $ref: '#/components/schemas/AgentTemplateArchiveRequest'
                - $ref: '#/components/schemas/AgentTemplateApplyRequest'
      responses:
        '200':
          description: The op's outcome.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AgentTemplateSaveResponse'
                  - $ref: '#/components/schemas/AgentTemplateOutcomeResponse'
                  - $ref: '#/components/schemas/AgentTemplateApplyResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /agent-message-template:
    post:
      operationId: agentMessageTemplate
      summary: The advisor's message templates. Create, edit, duplicate, archive or restore.
      description: |
        §3.10 Stage 2 (Screens 3.10.4 Library and 3.10.5 Editor). ONE endpoint with four ops.

        `create` and `duplicate` take an id the browser minted (a UUID v7 from the last hour),
        so a double click or a retry answers `exists` and writes once. An id that belongs to
        another advisor's template, and a template that is not the caller's or is archived
        (for `update` and `duplicate`'s source), are the same 404. `duplicate` names its copy
        "Copy of ..." cut to 80 characters. Only known `{{merge.fields}}` may appear in a body.
        No audit rows: a template holds no client data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/AgentMessageTemplateWriteRequest'
                - $ref: '#/components/schemas/AgentMessageTemplateDuplicateRequest'
                - $ref: '#/components/schemas/AgentMessageTemplateArchiveRequest'
      responses:
        '200':
          description: The op's outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentMessageTemplateResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /agent-settings:
    post:
      operationId: agentSettings
      summary: The advisor's own settings. Profile, photo, availability, time away, alerts, signature.
      description: |
        §3.12 (Screens 3.12.1 to 3.12.4). ONE endpoint with eight ops, chosen by `op`.

        Every write is one SQL transaction that also writes its audit row, with {from, to} for
        each changed field. A save that changes nothing writes nothing and answers `unchanged`.

        `set_avatar` takes a photo the browser already squared (base64, at most 1 MiB decoded,
        JPEG, PNG or WebP by its own first bytes). The server picks the Storage key and stores
        a PATH (`/storage/v1/object/public/agent-avatars/<agent>/<file>`), which each surface
        puts on its own public origin. The replaced photo is deleted after the profile moves.

        Time away is checked against today in the advisor's own time zone. 409s here are
        `overlap` (another block), `started` (edit a running block) and `past` (end one that
        is over), as the phone and web key them; a missing or other advisor's block is a 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/AgentSettingsProfileRequest'
                - $ref: '#/components/schemas/AgentSettingsAvatarRequest'
                - $ref: '#/components/schemas/AgentSettingsRemoveAvatarRequest'
                - $ref: '#/components/schemas/AgentSettingsAvailabilityRequest'
                - $ref: '#/components/schemas/AgentSettingsSaveTimeOffRequest'
                - $ref: '#/components/schemas/AgentSettingsEndTimeOffRequest'
                - $ref: '#/components/schemas/AgentSettingsNotificationsRequest'
                - $ref: '#/components/schemas/AgentSettingsSignatureRequest'
      responses:
        '200':
          description: The op's outcome.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentSettingsResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ───────────────────────────────────────────────────────────────────────────
  # §3.7 Commission (ledger and statement import)
  # ───────────────────────────────────────────────────────────────────────────

  /agent-commission:
    post:
      operationId: agentCommission
      summary: The commission ledger's writes. Add, edit, mark received, remove, export, weights.
      description: |
        Screens 3.7.3 (edit, mark received, remove), 3.7.4 (add), §3.7.2's export and 3.7.7's
        stage weights. ONE endpoint with six ops, chosen by `op`.

        Every write is audited INSIDE its SQL function, in the same transaction as the change
        (`commission.created`, `commission.updated`, `commission.payment_recorded`,
        `commission.removed`, `commission.exported`, `pipeline_weight.updated`).

        `update`, `payment` and `remove` name one line by `commissionId` at the
        `expectedVersion` the screen rendered; a mismatch is the 409. ONLY that optimistic
        lock is a 409: every outcome a form shows against a field comes back 200 with an
        `outcome` (`duplicate_reference`, `supplier_not_found`, `payment_would_clear`,
        `bad_date`, `not_removable`). A line that is not this advisor's, does not exist or was
        removed is the same 404 ("No such commission line."); a trip that is not theirs is
        404 "No such trip on your book.".

        Amounts in are whole cents (a number or a digit-string). `gapCents` and the CSV's
        cells come back as exact decimal text, never a float.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/AgentCommissionCreateRequest'
                - $ref: '#/components/schemas/AgentCommissionUpdateRequest'
                - $ref: '#/components/schemas/AgentCommissionPaymentRequest'
                - $ref: '#/components/schemas/AgentCommissionRemoveRequest'
                - $ref: '#/components/schemas/AgentCommissionExportRequest'
                - $ref: '#/components/schemas/AgentCommissionWeightsRequest'
      responses:
        '200':
          description: The op's outcome.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AgentCommissionCreateResponse'
                  - $ref: '#/components/schemas/AgentCommissionLineResponse'
                  - $ref: '#/components/schemas/AgentCommissionPaymentResponse'
                  - $ref: '#/components/schemas/AgentCommissionExportResponse'
                  - $ref: '#/components/schemas/AgentCommissionWeightsResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /commission-import:
    post:
      operationId: commissionImport
      summary: Upload, map, resolve, reconcile or discard an Inteletravel statement.
      description: |
        Screens 3.7.5 (upload, map) and 3.7.6 (resolve each row, mark as reconciled, or
        discard). ONE endpoint with five ops, chosen by `op`.

        `upload` takes the CSV as base64 (512 KB at most, up to 1,000 rows and 60 columns),
        reads it on the server (UTF-8, or Windows-1252 when it is not valid UTF-8; an Excel
        workbook is refused by name), stores it in the private `commission-statements` bucket
        under a key the server derives, and guesses a column map from the advisor's last
        statement, then from the header names. The same file again (by SHA-256, not
        discarded) is the `duplicate_file` outcome, with the earlier statement's id.

        Every other op names one statement by `importId` at the `expectedVersion` the screen
        rendered; a mismatch is the 409. ONLY that is a 409: every outcome a screen should
        explain is a 200 with an `outcome`. A statement that is not this advisor's, does not
        exist or was discarded is the same 404.

        Only `reconcile` writes the ledger, in one SQL transaction with an audit row per line
        (`commission.reconciled`, `commission.created`) and one for the statement
        (`commission.statement_reconciled`). `upload` and `discard` are audited too
        (`commission.statement_uploaded`, `commission.statement_discarded`); `discard` also
        removes the stored file.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/CommissionImportUploadRequest'
                - $ref: '#/components/schemas/CommissionImportMapRequest'
                - $ref: '#/components/schemas/CommissionImportResolveRequest'
                - $ref: '#/components/schemas/CommissionImportStatementRequest'
      responses:
        '200':
          description: The op's outcome.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/CommissionImportUploadResponse'
                  - $ref: '#/components/schemas/CommissionImportResponse'
                  - $ref: '#/components/schemas/CommissionImportReconcileResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  # ───────────────────────────────────────────────────────────────────────────
  # §3.11 Reports and the Export Center
  # ───────────────────────────────────────────────────────────────────────────

  /agent-report:
    post:
      operationId: agentReport
      summary: Download a report, or an Export Center file, as CSV.
      description: |
        §3.11 Reporting's audited download (P1). `export`: one report's own table for the
        period on screen. `center`: the Export Center's four types (§3.11.8) over an inclusive
        From/To range (none for clients). Reads for the SCREEN are not here: they are the
        `agent_report_*` functions, called with the advisor's own token.

        Every file writes one audit row in the same SQL call that returns its rows:
        `report.exported` (and `commission.exported` for the ledger), so no file leaves
        without its record.

        The CSV travels inside the JSON reply: RFC 4180, CRLF line ends and a trailing CRLF,
        no byte-order mark, money as exact decimals ("1234.56"), and a text cell starting with
        = + - @ tab or CR prefixed with an apostrophe. The Export Center's 400 details are
        written to be shown to the advisor as they are.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/AgentReportExportRequest'
                - $ref: '#/components/schemas/AgentReportCenterRequest'
      responses:
        '200':
          description: The file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentReportFile'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  securitySchemes:
    supabaseJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Supabase Auth access token. Edge Functions verify it via
        `_shared/auth.ts` `requireUser()`, which resolves the caller to a
        `platform_user` row and its role.

  schemas:
    Money:
      type: object
      description: An amount in minor units plus its currency.
      required: [amount, currency]
      properties:
        amount:
          type: string
          pattern: '^-?\d+$'
          description: Integer minor units (cents), as a string to preserve precision.
          examples: ["1284500"]
        currency:
          type: string
          minLength: 3
          maxLength: 3
          description: ISO-4217 alphabetic code.
          examples: ["USD"]


    SendTripMessageRequest:
      type: object
      # `tripId` is NO LONGER REQUIRED. Address the thread with tripId (2.2.7), with
      # conversationId (2.6.2), or with neither for the general thread (2.6.3). Sending both
      # is a 400. This cannot be expressed as a simple required list, hence the prose.
      required: [messageId, body]
      properties:
        messageId:
          type: string
          format: uuid
          description: |
            Client-generated UUID v7. The server validates that the embedded timestamp is
            recent (Data-Model §21.6) — `assertRecentUuidV7` in `_shared/uuid.ts`. Supplying
            the id client-side is what makes a retry idempotent.
        tripId:
          type: string
          format: uuid
          description: |
            The trip whose thread this belongs to. Mutually exclusive with `conversationId`;
            omit both to post into the traveler's general (trip-less) thread.
        conversationId:
          type: string
          format: uuid
          description: |
            An existing thread, addressed directly. Screen 2.6.2 uses this because a general
            thread has `trip_id IS NULL` and so has no trip to key on. Mutually exclusive
            with `tripId`.
        body:
          type: string
          minLength: 1
          maxLength: 8000
        attachmentDocumentIds:
          type: array
          description: Documents already registered via POST /trip-document.
          items:
            type: string
            format: uuid
          maxItems: 10

    SendTripMessageResponse:
      type: object
      required: [messageId, conversationId, createdAt]
      properties:
        messageId:
          type: string
          format: uuid
        conversationId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    RequestTripDocumentUploadRequest:
      type: object
      required: [documentId, tripId, filename, mimeType, sizeBytes, kind]
      properties:
        documentId:
          type: string
          format: uuid
          description: Client-generated UUID v7, validated as recent.
        tripId:
          type: string
          format: uuid
        filename:
          type: string
          minLength: 1
          maxLength: 255
        mimeType:
          type: string
          description: Must be one of the bucket's allowed types.
        sizeBytes:
          type: string
          pattern: '^\d+$'
          description: Integer byte count as a string, for the same precision reason as Money.
        kind:
          type: string
          description: The document kinds a client may contribute.
          enum: [passport, visa, insurance_cert, photo]

    RequestTripDocumentUploadResponse:
      type: object
      required: [documentId, uploadPath, expiresAt]
      properties:
        documentId:
          type: string
          format: uuid
        uploadPath:
          type: string
          description: >-
            Signed PUT target, as a path to join to the caller's own Supabase base URL —
            not an absolute URL. Storage signs against the origin the function sees from
            inside its container (`http://kong:8000` locally), which resolves nowhere in a
            browser or on a phone. The caller already holds the right origin, so it does
            the joining. The storage key itself is still never returned; the path carries
            the signature, not a readable key.
        expiresAt:
          type: string
          format: date-time

    TripDocumentUrlResponse:
      type: object
      required: [documentId, path, expiresAt, filename, mimeType]
      properties:
        documentId:
          type: string
          format: uuid
        path:
          type: string
          description: >-
            Signed read target, as a path to join to the caller's own Supabase base URL.
            See RequestTripDocumentUploadResponse.uploadPath for why this is not absolute.
        expiresAt:
          type: string
          format: date-time
        filename:
          type: string
        mimeType:
          type: string

    SaveTestimonialRequest:
      type: object
      required: [testimonialId, body]
      properties:
        testimonialId:
          type: string
          format: uuid
          description: Client-generated UUID v7, validated as recent.
        tripId:
          type: string
          format: uuid
          description: Omitted for a reflection not tied to one trip.
        body:
          type: string
          minLength: 1
          maxLength: 4000
        attribution:
          type: string
          maxLength: 120
          description: How the client wants to be credited.
        rating:
          type: integer
          minimum: 1
          maximum: 5
          description: Optional. The prompt is a question, not a star widget.
        submit:
          type: boolean
          default: false
          description: |
            False saves a draft; true moves it to `submitted`. A client can reach no other
            state — approval is an agent action.

    SaveTestimonialResponse:
      type: object
      required: [testimonialId, status]
      properties:
        testimonialId:
          type: string
          format: uuid
        status:
          type: string
          enum: [draft, submitted]
        submittedAt:
          type: string
          format: date-time

    # ── §3.2 Agent worklist ────────────────────────────────────────────────

    AgentTripStatusRequest:
      type: object
      required: [tripId, status, expectedVersion]
      properties:
        tripId: { type: string, format: uuid }
        status:
          type: string
          enum: [inquiry, proposal, booked, in_progress, completed, cancelled]
        expectedVersion:
          type: integer
          minimum: 1
          maximum: 2147483647
          description: >-
            `trip.version` as the board was rendered from. A mismatch is a 409.
            Required: the board always has it, and omitting it would make every
            drop last-write-wins.
        cancellationReason:
          type: string
          description: >-
            Required (non-blank) when `status` is `cancelled`; on any other status it
            must be text if sent, and is not written. Trimmed. Reaches
            `trip.cancellation_reason`, which Screen 2.2.10 shows the traveler.
        refundStatus:
          type: string
          enum: [none_expected, pending, partial, full]
          description: Only with `cancelled` (otherwise a 400). Absent keeps the stored value.
        refundDetail:
          type: string
          description: >-
            Only with `cancelled` (otherwise a 400). Trimmed; blank keeps the stored
            value.
        closeCommission:
          type: [array, "null"]
          maxItems: 100
          description: >-
            Only with `cancelled` (otherwise a 400). The open ledger lines the cancel
            dialog listed under "Mark these as Lost", each at the version it showed.
            Lines still Expected or Invoiced at that version are marked Lost, each with
            its own audit row in the same transaction; the rest are skipped.
          items:
            type: object
            required: [id, version]
            properties:
              id: { type: string, format: uuid }
              version: { type: integer, minimum: 1, maximum: 2147483647 }

    AgentTripStatusResponse:
      type: object
      required: [tripId, status, version, changed]
      properties:
        tripId: { type: string, format: uuid }
        status:
          type: string
          enum: [inquiry, proposal, booked, in_progress, completed, cancelled]
        previousStatus:
          type: string
          enum: [inquiry, proposal, booked, in_progress, completed, cancelled]
          description: >-
            Absent whenever the stage did not move (a no-op, or a cancellation-detail
            correction), because nothing was left behind.
        version:
          type: integer
          description: The version after the write. Send this as the next `expectedVersion`.
        changed:
          type: boolean
          description: >-
            False when the trip was already in this stage: no transition, so no
            `trip_status_history` row. It does NOT mean nothing was recorded: a
            corrected cancellation reason or refund detail writes the columns and an
            `audit_event` under `trip.cancellation_reason_changed`, and still reports
            false.
        cancellationReasonUpdated:
          type: boolean
          description: >-
            Present on every `cancelled` call and only those. True when this call wrote
            the reason (a transition into `cancelled`, or a same-stage correction);
            false when the stored reason already read that way.
        commissionLinesClosed:
          type: integer
          minimum: 0
          description: Present on every `cancelled` call. Lines this call marked Lost.
        commissionLinesSkipped:
          type: integer
          minimum: 0
          description: >-
            Present on every `cancelled` call. Named lines left as they were: moved
            since the dialog opened (paid, edited, removed) or not on this trip.

    AgentTripStatusBulkRequest:
      type: object
      required: [op, status, trips]
      properties:
        op:
          type: string
          enum: [bulk]
        status:
          type: string
          enum: [inquiry, proposal, booked, in_progress, completed]
          description: "`cancelled` is refused: cancelling is one trip at a time."
        trips:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [tripId, fromStatus]
            properties:
              tripId: { type: string, format: uuid }
              fromStatus:
                type: string
                enum: [inquiry, proposal, booked, in_progress, completed, cancelled]
                description: The status the row was showing. A trip no longer in it is skipped.

    AgentTripStatusBulkResponse:
      type: object
      required: [outcome, status, movedCount, requestedCount]
      properties:
        outcome:
          type: string
          enum: [moved]
        status:
          type: string
          enum: [inquiry, proposal, booked, in_progress, completed]
        movedCount: { type: integer, minimum: 0 }
        requestedCount: { type: integer, minimum: 1 }

    AgentTripNotesRequest:
      type: object
      required: [tripId, notes, expectedVersion]
      properties:
        tripId: { type: string, format: uuid }
        notes:
          type: string
          description: Replaces `trip.notes` outright. An empty string clears it.
        expectedVersion:
          type: integer
          description: >-
            `trip.version` as the tab was rendered from. A mismatch is a 409.
            Required for the same reason as `/agent-trip-status`'s field.

    AgentTripNotesResponse:
      type: object
      required: [tripId, version, changed]
      properties:
        tripId: { type: string, format: uuid }
        version:
          type: integer
          description: The version after the write. Send this as the next `expectedVersion`.
        changed:
          type: boolean
          description: False when the submitted notes matched what was already stored.

    # ── §3.10 Agent messaging ──────────────────────────────────────────────

    AgentSendMessageRequest:
      type: object
      required: [op, messageId, body, internalNote]
      properties:
        op:
          type: string
          enum: [send]
        messageId:
          type: string
          format: uuid
          description: |
            Client-generated UUID v7, minted once per draft so a double send or a retry
            lands once (the repeat is a 400, "already sent"). Validated as recent.
        conversationId:
          type: string
          format: uuid
          description: An existing thread. Mutually exclusive with `clientId` / `tripId`.
        clientId:
          type: string
          format: uuid
          description: Starts or finds this client's live thread. Mutually exclusive with `conversationId`.
        tripId:
          type: string
          format: uuid
          description: With `clientId`, that trip's thread; without it, the general thread.
        body:
          type: string
          minLength: 1
          maxLength: 8000
        internalNote:
          type: boolean
          description: REQUIRED. True writes a note only the advisor sees.
        seenUpTo:
          type: string
          description: |
            `created_at` of the newest message on screen, EXACTLY as PostgREST wrote it.
            Writing in a thread reads it only up to here. Omitted on a new message.

    AgentSendMessageResponse:
      type: object
      required: [messageId, conversationId, createdAt]
      properties:
        messageId: { type: string, format: uuid }
        conversationId:
          type: string
          format: uuid
          description: The thread written to, which a new message may have just started.
        createdAt: { type: string, format: date-time }

    PushRegisterRequest:
      type: object
      required: [op, platform, deviceId]
      properties:
        op:
          type: string
          enum: [register]
        platform:
          type: string
          enum: [web, android]
        deviceId:
          type: string
          format: uuid
          description: A fresh client-minted v7. An address already registered keeps its own id.
        fcmToken:
          type: string
          minLength: 20
          maxLength: 4096
          description: "`android` only, and required there: the Firebase registration token."
        subscription:
          type: object
          description: "`web` only, and required there: `PushSubscription.toJSON()`."
          additionalProperties: true
        label:
          type: string
          description: '"Chrome · macOS" or the phone model, for a later device list. Optional.'

    PushUnregisterRequest:
      type: object
      required: [op]
      description: At least one of `fcmToken` (a phone) or `endpoint` (a browser); neither is a 400.
      anyOf:
        - required: [fcmToken]
        - required: [endpoint]
      properties:
        op:
          type: string
          enum: [unregister]
        fcmToken: { type: string }
        endpoint: { type: string }

    PushDeviceResponse:
      type: object
      required: [outcome]
      properties:
        outcome:
          type: string
          enum: [registered, unregistered, not_found]
        deviceId:
          type: string
          format: uuid
          description: "`register` only: the device's row id."

    AgentMarkThreadReadRequest:
      type: object
      required: [op, conversationId, seenUpTo]
      properties:
        op:
          type: string
          enum: [read]
        conversationId: { type: string, format: uuid }
        seenUpTo:
          type: string
          description: "`created_at` of the newest message on screen, as PostgREST wrote it."

    AgentMarkThreadReadResponse:
      type: object
      required: [changed]
      properties:
        changed:
          type: boolean
          description: False when nothing was unread, or the thread is not the caller's (one answer).

    AgentArchiveThreadsRequest:
      type: object
      required: [op, conversationIds, archived]
      properties:
        op:
          type: string
          enum: [archive]
        conversationIds:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string, format: uuid }
        archived:
          type: boolean
          description: True archives from the advisor's inbox; false brings back.

    AgentArchiveThreadsResponse:
      type: object
      required: [moved, requested]
      properties:
        moved: { type: integer }
        requested: { type: integer }

    # ── §2.1 Onboarding ────────────────────────────────────────────────────
    #
    # No `required` list on any of these, and that is the contract rather than an
    # omission: absent means "leave it alone", explicit null means "clear it". A
    # `required` array would break "Skip for now", which posts `{}`.

    OnboardingStepRequest:
      type: object
      properties:
        step:
          type: string
          enum: [profile, preferences, companions, connect, complete]
          description: >-
            The step to move the cursor to. Reaching `complete` is not the same
            as finishing — that is what `complete: true` is for.
        complete:
          type: boolean
          description: >-
            Marks onboarding finished by setting `onboarding_completed_at`.
            Mutually exclusive with `step` in practice: this is checked first.

    OnboardingStepResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        step:
          type: string
          enum: [profile, preferences, companions, connect, complete]
          description: Echoed back when the request moved the cursor.
        completed:
          type: boolean
          description: True when the request finished onboarding.

    OnboardingOkResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean

    OnboardingIdResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        id:
          type: [string, "null"]
          description: >-
            The row written. Null when the call wrote nothing — a companions
            request with `action: none`.

    OnboardingEmergencyContact:
      type: [object, "null"]
      description: >-
        All or nothing. A name with no number looks like a safety net and is not
        one, so a half-filled contact is a 400 rather than a partial row. Null
        clears it. Stored as jsonb on `client.emergency_contact`; see
        Data-Model §6.1.
      properties:
        name:
          type: string
        phone:
          type: string
          description: Normalised to E.164, as everywhere else in the schema.
        relationship:
          type: [string, "null"]

    OnboardingAddress:
      type: [object, "null"]
      description: >-
        Six structured fields, not one line — `client.mailing_address_id` is a FK
        to `address` and there is no free-text address column anywhere. `line1`,
        `city` and `country` are required TOGETHER or the whole object must be
        absent or null; two of the three is a 400.
      properties:
        line1:
          type: string
        line2:
          type: [string, "null"]
        city:
          type: string
        region:
          type: [string, "null"]
        postalCode:
          type: [string, "null"]
        country:
          type: string
          minLength: 2
          maxLength: 2
          description: ISO-3166-1 alpha-2, matching `address.country`'s char(2).

    OnboardingPassport:
      type: [object, "null"]
      description: >-
        Expiry and issuing country only. See the endpoint description: sending
        `number` is a 400, not an ignored field.
      properties:
        expiresOn:
          type: [string, "null"]
          format: date
          description: What drives the renewal reminder, and the reason this object exists.
        issuingCountry:
          type: [string, "null"]
          minLength: 2
          maxLength: 2

    OnboardingProfileRequest:
      type: object
      properties:
        phone:
          type: [string, "null"]
        dateOfBirth:
          type: [string, "null"]
          format: date
        emergencyContact:
          $ref: '#/components/schemas/OnboardingEmergencyContact'
        address:
          $ref: '#/components/schemas/OnboardingAddress'
        passport:
          $ref: '#/components/schemas/OnboardingPassport'
        advance:
          type: boolean
          default: false

    OnboardingLoyaltyProgram:
      type: object
      required: [program]
      description: >-
        A wholly empty entry is skipped — it is the repeater's last blank line,
        not a mistake. A number without a program is a 400.
      properties:
        program:
          type: string
          maxLength: 60
        number:
          type: [string, "null"]
          pattern: '^[A-Za-z0-9-]{1,40}$'
          description: >-
            Alphanumeric and hyphens. Anything else is a paste accident, and this
            is a number somebody will read back to an airline.

    OnboardingPreferencesRequest:
      type: object
      description: >-
        Every list is validated against the vocabulary in Data-Model §6.2. Null
        clears a list; absent leaves it.
      properties:
        destinations:
          type: [array, "null"]
          maxItems: 12
          items:
            type: string
            maxLength: 60
          description: Free text — the wish list is the traveler's, not a menu.
        travelStyles:
          type: [array, "null"]
          items:
            type: string
            enum: [resort, cruise, adventure, family, romantic, group]
        dietary:
          type: [array, "null"]
          items:
            type: string
            enum: [none, vegetarian, pescatarian, gluten_free, halal]
          description: '`none` is exclusive — with anything else it is a 400.'
        dietaryNotes:
          type: [string, "null"]
          maxLength: 500
        accessibility:
          type: [array, "null"]
          items:
            type: string
            enum: [none, mobility, quiet_room, service_animal]
          description: '`none` is exclusive, as with dietary.'
        accessibilityNotes:
          type: [string, "null"]
          maxLength: 500
        favoritePastTrips:
          type: [string, "null"]
          maxLength: 1000
        budgetBand:
          type: [string, "null"]
          enum: [budget, mid, premium, luxury, null]
          description: >-
            Four bands, not a figure. See the endpoint description for why the
            prototype's dual-thumb slider did not survive.
        loyalty:
          type: [array, "null"]
          maxItems: 10
          items:
            $ref: '#/components/schemas/OnboardingLoyaltyProgram'
        advance:
          type: boolean
          default: false

    OnboardingCompanionRequest:
      type: object
      properties:
        action:
          type: string
          enum: [add, edit, remove, none]
          default: add
          description: >-
            `none` writes nothing and exists so "Save & continue" on an already
            complete list can advance the cursor without inventing a row.
        id:
          type: string
          format: uuid
          description: Required for `edit` and `remove`.
        firstName:
          type: string
          maxLength: 80
          description: Required together with lastName for `add` and `edit`.
        lastName:
          type: string
          maxLength: 80
        relationship:
          type: [string, "null"]
          maxLength: 40
        dateOfBirth:
          type: [string, "null"]
          format: date
        passportExpiry:
          type: [string, "null"]
          format: date
        passportCountry:
          type: [string, "null"]
          pattern: '^[A-Za-z]{2}$'
          description: Two-letter country code, stored upper case. (A passport NUMBER is refused.)
        advance:
          type: boolean
          default: false

    OnboardingConnectRequest:
      type: object
      properties:
        code:
          type: [string, "null"]
          description: >-
            The agent's invite code. Omitted or null is "I don't have a code" —
            a first-class exit, not an error.
        advance:
          type: boolean
          default: false

    OnboardingConnectResponse:
      type: object
      required: [ok, redeemed]
      properties:
        ok:
          type: boolean
        redeemed:
          type: boolean
          description: False when the traveler declined to enter a code.

    Problem:
      type: object
      description: RFC 7807 problem details. Every error response uses this shape.
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri
          default: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string

    HotelSearchRequest:
      type: object
      required: [destination, checkIn, checkOut]
      properties:
        destination:
          type: string
          maxLength: 60
          description: Free text, as typed. Normalised server-side before it becomes a cache key.
        checkIn:
          type: string
          format: date
        checkOut:
          type: string
          format: date
          description: Must be after checkIn, and at most 30 nights later.
        adults:
          type: integer
          minimum: 1
          maximum: 8
          default: 2
        childrenAges:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 17
          maxItems: 6
        hotelClass:
          type: array
          description: Google star classification, 2-5. Not the guest rating.
          items:
            type: string
        amenities:
          type: array
          description: Google amenity ids. Unknown values are dropped, never forwarded.
          items:
            type: string
        minPrice:
          type: integer
          nullable: true
        maxPrice:
          type: integer
          nullable: true
        sortBy:
          type: string
          description: SerpApi sort id — "3" lowest price, "8" highest rating, "13" most reviewed. Empty means the provider's own relevance.

    HotelRate:
      type: object
      description: |
        ONE indicative nightly rate, deliberately not a list. The provider returns one entry
        per booking site, each carrying a source, a logo and a link; a list here — even with
        those fields omitted — would invite someone to add the source back "for attribution".
        A single scalar cannot.
      required: [amountCents, currency, basis, beforeTaxesFees]
      properties:
        amountCents:
          type: string
          description: Integer minor units as a string (CLAUDE.md rule 5).
        currency:
          type: string
          minLength: 3
          maxLength: 3
        basis:
          type: string
          enum: [night]
          description: The only basis published. A total-for-the-stay reads like a quote.
        beforeTaxesFees:
          type: boolean

    HotelImage:
      type: object
      required: [url]
      properties:
        url:
          type: string
          description: Host allow-listed at the mapper and again in web/.

    HotelLocation:
      type: object
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
        longitude:
          type: number

    HotelResult:
      type: object
      required: [id, name, amenities, images, ecoCertified]
      properties:
        id:
          type: string
        propertyToken:
          type: string
          nullable: true
          description: Opaque provider id, carried so the later inquiry step can name the hotel. Not a URL.
        name:
          type: string
        description:
          type: string
          nullable: true
        propertyType:
          type: string
          nullable: true
        hotelClass:
          type: integer
          nullable: true
        overallRating:
          type: number
          nullable: true
        reviewCount:
          type: integer
          nullable: true
        location:
          $ref: '#/components/schemas/HotelLocation'
        checkInTime:
          type: string
          nullable: true
        checkOutTime:
          type: string
          nullable: true
        amenities:
          type: array
          items:
            type: string
        images:
          type: array
          items:
            $ref: '#/components/schemas/HotelImage'
        ecoCertified:
          type: boolean
        rate:
          $ref: '#/components/schemas/HotelRate'

    HotelSearchEcho:
      type: object
      required: [destination, checkIn, checkOut, adults, nights]
      properties:
        destination:
          type: string
        checkIn:
          type: string
          format: date
        checkOut:
          type: string
          format: date
        adults:
          type: integer
        nights:
          type: integer

    HotelSearchResponse:
      type: object
      required: [version, currency, results, hasMore, source, asOf, query]
      properties:
        version:
          type: integer
          description: Payload shape version. Part of the cache key, so a change means a cold cache.
        currency:
          type: string
        totalAvailable:
          type: integer
          nullable: true
        results:
          type: array
          items:
            $ref: '#/components/schemas/HotelResult'
        hasMore:
          type: boolean
          description: Always false. Each extra page is another billable search.
        source:
          type: string
          enum: [live, cache, stale]
        degraded:
          type: string
          nullable: true
          enum: [budget_exhausted, provider_unavailable]
        asOf:
          type: string
          format: date-time
        staleAsOf:
          type: string
          format: date-time
          nullable: true
          description: Set only when source is "stale". The page must show how old the prices are.
        query:
          $ref: '#/components/schemas/HotelSearchEcho'

    CruiseSearchRequest:
      type: object
      description: |
        Every field is optional. An empty body is the valid "what is sailing soon" query,
        which is what Screen 2.0.4 issues before the visitor has typed anything.
      properties:
        destination:
          type: string
          maxLength: 60
          description: |
            Free text, matched against the sailing title and its destinations array. Not a
            port name — port calls are returned but are not searched.
        from:
          type: string
          format: date
          description: Earliest departure. Defaults to today; the past is never returned.
        to:
          type: string
          format: date
          description: Latest departure. Must not be before `from`.
        minNights:
          type: integer
          minimum: 1
          maximum: 60
        maxNights:
          type: integer
          minimum: 1
          maximum: 60
        limit:
          type: integer
          minimum: 1
          maximum: 24
          default: 24
          description: Out-of-range values fall back to the default rather than erroring.

    ShipImage:
      type: object
      required: [url, credit]
      description: |
        A ship photo and the attribution that may not be separated from it.

        ONE OBJECT RATHER THAN FOUR SIBLING FIELDS, because the credit is a licence
        condition. Every photo is CC BY or CC BY-SA, both of which require credit wherever
        the work appears, so `credit` is required here and the pair is enforced all the way
        down: `cruise_ship_image_attributed` is a CHECK in Postgres, the mapper drops a
        photo whose credit is missing, and the web client's zod twin repeats it. Nesting is
        what makes "a URL with no credit" unspellable rather than merely discouraged.
      properties:
        url:
          type: string
          description: |
            Always an `https://upload.wikimedia.org/` URL. Host-pinned by a CHECK on the
            column and checked again in `web/lib/public/cruises.ts` — `web/next.config.ts`
            registers a custom next/image loader, so `remotePatterns` is never consulted
            and nothing else decides where a visitor's browser is sent.
        credit:
          type: string
          description: |
            Pre-rendered attribution, e.g. "Kiran891 / Wikimedia Commons, CC BY-SA 4.0".
            MUST be displayed wherever the image is. Commons attribution runs long — 214
            characters in the current catalog — so a client must let it wrap rather than
            truncate it. An ellipsis through an author's name is not attribution.
        license:
          type: string
          nullable: true
          description: Commons' LicenseShortName — "CC BY-SA 4.0", "Public domain", "CC0".
        sourceUrl:
          type: string
          nullable: true
          description: The Commons file page. What the credit line should link to.

    CruiseSailing:
      type: object
      required: [id, title, line, ship, departureDate, nights, destinations, ports, shipImage]
      description: |
        NO FARE FIELD, by construction. See the note on `/cruise-search`.
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          description: Provider-supplied, e.g. "7 Night Eastern Caribbean". Falls back to "Cruise".
        line:
          type: string
          nullable: true
        ship:
          type: string
          nullable: true
        departureDate:
          type: string
          format: date
        nights:
          type: integer
          nullable: true
        destinations:
          type: array
          maxItems: 6
          items:
            type: string
        ports:
          type: array
          maxItems: 12
          description: |
            Port calls in sequence. Consecutive duplicates are collapsed — an overnight in
            port is two calls at the same place, and "Nassau · Nassau · Miami" looks broken.
          items:
            type: string
        shipImage:
          allOf:
            - $ref: '#/components/schemas/ShipImage'
          nullable: true
          description: |
            Null is normal and common. Only the 151 curated hulls carry a photo; the sync
            mints a bare `cruise_ship` stub for any ship name it has not seen, and 2025-26
            newbuilds often have no Commons photo yet.

    CruiseSearchResponse:
      type: object
      required: [results]
      description: |
        Deliberately flat. There is no `source`, `asOf` or `degraded` here as there is on
        `HotelSearchResponse`: this reads our own table, so there is no cache tier to
        report and no budget to exhaust.
      properties:
        results:
          type: array
          description: Soonest departure first. Archived sailings are never included.
          items:
            $ref: '#/components/schemas/CruiseSailing'

    # ── §3.8 Leads ─────────────────────────────────────────────────────────

    OkResponse:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean, const: true }

    LeadMessageRequest:
      type: object
      required: [firstName, email, message, startedAt]
      properties:
        firstName: { type: string, maxLength: 80 }
        lastName: { type: [string, 'null'], maxLength: 80 }
        email: { type: string, format: email, maxLength: 254 }
        phone: { type: [string, 'null'], maxLength: 40 }
        message:
          type: string
          maxLength: 2000
          description: A card number anywhere in it is refused.
        page:
          type: [string, 'null']
          enum: [landing, how-it-works, about, topic, results, detail, join, app, null]
          description: Where the form was. An unknown value is dropped, not refused.
        aboutKind: { type: [string, 'null'], enum: [trip, topic, null] }
        aboutSlug: { type: [string, 'null'], maxLength: 120 }
        aboutLabel: { type: [string, 'null'], maxLength: 120 }
        utmSource: { type: [string, 'null'], maxLength: 100 }
        utmMedium: { type: [string, 'null'], maxLength: 100 }
        utmCampaign: { type: [string, 'null'], maxLength: 100 }
        startedAt:
          type: number
          description: When the form was drawn, epoch milliseconds. A send under three seconds later is treated as automated.
        website:
          type: string
          description: The hidden field. Anything in it marks the send as automated.

    AgentLeadRequest:
      type: object
      required: [op]
      properties:
        op:
          type: string
          enum: [create, mark_contacted, close, reopen, convert, delete_spam]
        leadId:
          type: string
          format: uuid
          description: Every op but `create`.
        firstName: { type: string, maxLength: 80, description: '`create` only.' }
        lastName: { type: [string, 'null'], maxLength: 80 }
        email: { type: string, format: email, description: '`create` only.' }
        phone: { type: [string, 'null'], maxLength: 40 }
        source:
          type: string
          enum: [email, phone, referral, social, other]
          description: '`create` only.'
        message: { type: string, maxLength: 2000, description: '`create` only. A card number is refused.' }
        reason:
          type: string
          enum: [not_a_fit, no_reply, went_elsewhere, other]
          description: '`close` only.'
        note: { type: [string, 'null'], maxLength: 500, description: '`close` only. Private to the advisor.' }
        clientId: { type: string, format: uuid, description: '`convert` only: one of the caller''s clients.' }

    AgentLeadCreateResponse:
      type: object
      required: [outcome]
      properties:
        outcome: { type: string, enum: [created, added, client_exists] }
        leadId: { type: string, format: uuid, description: 'On `created` and `added`.' }
        clientId: { type: string, format: uuid, description: 'On `client_exists`.' }

    AgentLeadWriteResponse:
      type: object
      required: [leadId, outcome, status]
      properties:
        leadId: { type: string, format: uuid }
        outcome: { type: string, enum: [changed, noop, deleted] }
        status:
          type: [string, 'null']
          enum: [new, contacted, closed, converted, null]
          description: The lead's status after the op; null once deleted.

    # ── §2.3 Quote requests (P2) ──

    QuoteRequestRequest:
      type: object
      required: [tripId, kind, name]
      description: |
        Text fields are cleaned before use: control characters become spaces, runs of white
        space one space, then trimmed and cut to the stated length in UTF-16 units. A field
        that is not a string, or is empty after cleaning, counts as absent.
      properties:
        tripId:
          type: string
          format: uuid
          description: Client-generated UUID v7, validated as recent (within an hour either way).
        kind:
          type: string
          enum: [hotel, cruise, excursion, custom]
          description: The component kind. Only what a public search surface can produce.
        tripType:
          type: string
          enum: [cruise, all_inclusive, multi_destination, group, custom]
          description: Optional. Missing or unknown falls back to `cruise` for a cruise and `custom` otherwise; never refused.
        name:
          type: string
          maxLength: 120
          description: What the traveler is asking about. Becomes the component's display name and the trip title.
        location:
          type: string
          maxLength: 120
          description: Optional. When present the title is "<name> · <location>" (cut to 120) and the trip's destinations are [location].
        checkIn:
          type: [string, 'null']
          format: date
          description: YYYY-MM-DD, a real calendar date. Send both dates or neither; null or "" is "not sent". A sent date that does not parse is a 400, never dropped.
        checkOut:
          type: [string, 'null']
          format: date
          description: YYYY-MM-DD, after checkIn.
        travelers:
          type: number
          description: Rounded, then held to 1..20. Anything not a finite number means 2.
          default: 2
        note:
          type: string
          maxLength: 2000
          description: Optional. Becomes `trip.notes`.
        snapshot:
          type: object
          description: |
            What the traveler saw, kept on the component's payload. Treated as hostile: only
            these keys survive, and `capturedAt` (the server's time) is added. A non-object
            is read as {}.
          properties:
            propertyType: { type: string, maxLength: 300 }
            photoUrl: { type: string, maxLength: 300 }
            propertyToken: { type: string, maxLength: 300 }
            indicativeRateCents:
              type: number
              minimum: 0
              description: The provider's nightly rate, kept as sent. Never a cost or a quote.
            hotelClass: { type: number, minimum: 0 }
            rating: { type: number, minimum: 0 }
            reviewCount: { type: number, minimum: 0 }
            amenities:
              type: array
              description: The first 12 strings, each cut to 60. Non-strings are dropped.
              items: { type: string, maxLength: 60 }
          additionalProperties: true
        source:
          type: string
          enum: [curated, serpapi_google_hotels, track_cruises]
          description: Where the result came from (`trip_component.api_source`). Missing or unknown is `curated`.
        apiReference:
          type: string
          maxLength: 220
          description: The provider's id for the result (`trip_component.api_reference`).

    QuoteRequestResponse:
      type: object
      required: [tripId, status]
      properties:
        tripId:
          type: string
          format: uuid
          description: The id the caller sent, as sent.
        status:
          type: string
          const: inquiry

    # ── §3.4 Trip Builder and itinerary (agent-trip, agent-itinerary) ──

    # ── §3.4 Trip builder and §3.6 pay links ───────────────────────────────

    AgentTripCents:
      description: >-
        Integer minor units, as a JSON integer or a digit string of at most ten digits.
        Blank (absent, null or "") reads as 0 except where a field says otherwise.
      oneOf:
        - type: integer
          minimum: 0
          maximum: 9999999999
        - type: string
          pattern: '^\s*\d{1,10}\s*$'

    AgentTripCreateRequest:
      type: object
      required: [op, clientId, tripType, title]
      properties:
        op:
          type: string
          enum: [create]
        clientId: { type: string, format: uuid }
        tripType:
          type: string
          enum: [cruise, all_inclusive, multi_destination, group, custom]
        title:
          type: string
          minLength: 1
          maxLength: 160
          description: Trimmed; required.
        travelerCount:
          type: integer
          description: Clamped to 1..64. Absent or not an integer is 1.

    AgentTripCreateResponse:
      type: object
      required: [outcome]
      properties:
        outcome:
          type: string
          enum: [created, no_client]
        tripId:
          type: string
          format: uuid
          description: Present only on `created`.

    AgentTripComponentRequest:
      type: object
      required: [op, tripId, kind, displayName]
      properties:
        op:
          type: string
          enum: [component_upsert]
        tripId: { type: string, format: uuid }
        componentId:
          type: [string, "null"]
          format: uuid
          description: Present edits that component; absent or null creates one ("" is a 400).
        kind:
          type: string
          enum: [flight, hotel, cruise, transfer, excursion, insurance, custom]
        supplierId:
          type: [string, "null"]
          format: uuid
        displayName:
          type: string
          minLength: 1
          maxLength: 200
        startDate: { type: [string, "null"], format: date }
        endDate: { type: [string, "null"], format: date }
        startTime:
          type: [string, "null"]
          description: HH:MM or HH:MM:SS.
        endTime:
          type: [string, "null"]
          description: HH:MM or HH:MM:SS.
        location: { type: [string, "null"], maxLength: 200 }
        confirmationNumber: { type: [string, "null"], maxLength: 80 }
        costCents: { $ref: '#/components/schemas/AgentTripCents' }
        commissionPct:
          type: [number, string, "null"]
          description: 0 to 999.99, rounded to two places.
        commissionCents:
          description: Blank with a rate set is worked out from the rate; anything typed wins.
          oneOf:
            - $ref: '#/components/schemas/AgentTripCents'
            - type: "null"
        detail:
          type: [object, "null"]
          description: >-
            The kind's own fields (Data-Model §23), snake_case: flight_number, cabin,
            seat, room_type, board_basis, ship, itinerary_name, dining_seating,
            gratuities_included (true/false), dropoff, vehicle, duration, plan,
            coverage, notes, as the kind allows. Unknown keys are a 400.
          additionalProperties:
            type: [string, boolean]

    AgentTripComponentArchiveRequest:
      type: object
      required: [op, tripId, componentId]
      properties:
        op:
          type: string
          enum: [component_archive]
        tripId: { type: string, format: uuid }
        componentId: { type: string, format: uuid }

    AgentTripComponentResponse:
      type: object
      required: [outcome, componentId]
      properties:
        outcome:
          type: string
          enum: [created, updated, noop, archived]
        componentId: { type: string, format: uuid }

    AgentTripComponentReorderRequest:
      type: object
      required: [op, tripId, componentIds]
      properties:
        op:
          type: string
          enum: [component_reorder]
        tripId: { type: string, format: uuid }
        componentIds:
          type: array
          minItems: 1
          maxItems: 500
          uniqueItems: true
          description: Every live component of the trip, in the new order. Fewer or more is a 409.
          items: { type: string, format: uuid }

    AgentTripReorderResponse:
      type: object
      required: [outcome, moved]
      properties:
        outcome:
          type: string
          enum: [reordered]
        moved: { type: integer, minimum: 0 }

    AgentTripMilestoneRequest:
      type: object
      required: [op, tripId, kind, label]
      properties:
        op:
          type: string
          enum: [payment_upsert]
        tripId: { type: string, format: uuid }
        milestoneId:
          type: [string, "null"]
          format: uuid
          description: Present edits that milestone; absent or null creates one.
        kind:
          type: string
          enum: [deposit, interim, final]
        label:
          type: string
          minLength: 1
          maxLength: 120
        amountCents: { $ref: '#/components/schemas/AgentTripCents' }
        dueDate: { type: [string, "null"], format: date }

    AgentTripMilestoneDeleteRequest:
      type: object
      required: [op, tripId, milestoneId]
      properties:
        op:
          type: string
          enum: [payment_delete]
        tripId: { type: string, format: uuid }
        milestoneId: { type: string, format: uuid }

    AgentTripMilestoneResponse:
      type: object
      required: [outcome, milestoneId]
      properties:
        outcome:
          type: string
          enum: [created, updated, noop, deleted]
        milestoneId: { type: string, format: uuid }

    AgentTripMilestonePaidRequest:
      type: object
      required: [op, tripId, milestoneId, status]
      properties:
        op:
          type: string
          enum: [payment_paid]
        tripId: { type: string, format: uuid }
        milestoneId: { type: string, format: uuid }
        status:
          type: string
          enum: [scheduled, paid, waived, overdue]
        paidCents:
          description: Absent, null or "" means the whole amount; 0 means nothing landed.
          oneOf:
            - $ref: '#/components/schemas/AgentTripCents'
            - type: "null"
        paidReference:
          type: [string, "null"]
          maxLength: 100
          description: Absent or null keeps the stored one; "" clears it. No card numbers.
        paidNote:
          type: [string, "null"]
          maxLength: 1000
          description: Absent or null keeps the stored one; "" clears it. No card numbers.
        paidOn:
          type: [string, "null"]
          format: date
          description: When it was paid. Not after the advisor's today.

    AgentTripMilestonePaidResponse:
      type: object
      required: [outcome, milestoneId, paidCents]
      properties:
        outcome:
          type: string
          enum: [changed, noop]
        milestoneId: { type: string, format: uuid }
        paidCents:
          type: string
          description: The milestone's paid amount after the write, integer minor units as a string.

    AgentTripPayLinkRequest:
      type: object
      required: [op, tripId, milestoneId]
      properties:
        op:
          type: string
          enum: [payment_link]
        tripId: { type: string, format: uuid }
        milestoneId: { type: string, format: uuid }
        payUrl:
          type: [string, "null"]
          maxLength: 2048
          description: >-
            The supplier's own https:// payment page (or a Travefy invoice carrying supplier
            cost only). Null, "" or absent removes the link.

    AgentTripPayLinkResponse:
      type: object
      required: [outcome, milestoneId, payUrl]
      properties:
        outcome:
          type: string
          enum: [set, changed, removed, noop]
        milestoneId: { type: string, format: uuid }
        payUrl:
          type: [string, "null"]
          description: The link as stored (parsed and normalised), or null when there is none.

    # ── §3.4.14 Itinerary Editor ───────────────────────────────────────────

    AgentItineraryGenerateRequest:
      type: object
      required: [op, tripId]
      properties:
        op:
          type: string
          enum: [generate]
        tripId: { type: string, format: uuid }

    AgentItineraryGenerateResponse:
      type: object
      required: [outcome, daysAdded, activitiesAdded]
      properties:
        outcome:
          type: string
          enum: [generated, noop, no_dates]
        daysAdded: { type: integer, minimum: 0 }
        activitiesAdded: { type: integer, minimum: 0 }

    AgentItineraryDayRequest:
      type: object
      required: [op, tripId]
      properties:
        op:
          type: string
          enum: [day_upsert]
        tripId: { type: string, format: uuid }
        dayId:
          type: [string, "null"]
          format: uuid
          description: Present edits that day. Absent, null or "" creates one.
        date:
          type: [string, "null"]
          format: date
          description: >-
            yyyy-mm-dd. Required on a create; on an edit, absent or null keeps the
            stored date. A shape that is a date but not a real one is refused by
            Postgres (a 500), as before the port.
        label:
          type: [string, "null"]
          maxLength: 120
          description: Trimmed; blank stores null.
        summary:
          type: [string, "null"]
          maxLength: 4000
          description: Trimmed; blank stores null.

    AgentItineraryDayResponse:
      type: object
      required: [outcome, dayId]
      properties:
        outcome:
          type: string
          enum: [created, updated, noop]
        dayId: { type: string, format: uuid }

    AgentItineraryActivityRequest:
      type: object
      required: [op, tripId, title]
      properties:
        op:
          type: string
          enum: [activity_upsert]
        tripId: { type: string, format: uuid }
        activityId:
          type: [string, "null"]
          format: uuid
          description: Present edits that activity. Absent, null or "" creates one.
        dayId:
          type: [string, "null"]
          format: uuid
          description: Required on a create. On an edit, a different day moves the activity.
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Trimmed; required.
        block:
          type: [string, "null"]
          enum: [morning, afternoon, evening, all_day, null]
          description: Omitted, null or "" is worked out from `startTime`.
        startTime:
          type: [string, "null"]
          description: HH:MM or HH:MM:SS, 00:00 to 23:59:59.
        endTime:
          type: [string, "null"]
          description: HH:MM or HH:MM:SS, 00:00 to 23:59:59.
        body: { type: [string, "null"], maxLength: 4000 }
        location: { type: [string, "null"], maxLength: 200 }
        address: { type: [string, "null"], maxLength: 200 }
        phone: { type: [string, "null"], maxLength: 40 }
        confirmationNumber: { type: [string, "null"], maxLength: 80 }
        gyasisTip: { type: [string, "null"], maxLength: 2000 }

    AgentItineraryActivityDeleteRequest:
      type: object
      required: [op, tripId, activityId]
      properties:
        op:
          type: string
          enum: [activity_delete]
        tripId: { type: string, format: uuid }
        activityId: { type: string, format: uuid }

    AgentItineraryActivityResponse:
      type: object
      required: [outcome, activityId]
      properties:
        outcome:
          type: string
          enum: [created, updated, noop, deleted]
        activityId: { type: string, format: uuid }

    AgentItineraryReorderRequest:
      type: object
      required: [op, tripId, dayId, activityIds]
      properties:
        op:
          type: string
          enum: [reorder]
        tripId: { type: string, format: uuid }
        dayId: { type: string, format: uuid }
        activityIds:
          type: array
          minItems: 1
          maxItems: 200
          uniqueItems: true
          description: Every activity on the day, in the new order. Fewer or more is a 409.
          items: { type: string, format: uuid }

    AgentItineraryReorderResponse:
      type: object
      required: [outcome, moved]
      properties:
        outcome:
          type: string
          enum: [reordered]
        moved:
          type: integer
          minimum: 0
          description: Activities whose position changed.

    # ── §3.3 Clients, §3.5 templates, §3.10 message templates, §3.12 settings ──

    AgentClientFields:
      type: object
      required: [firstName, lastName, email]
      properties:
        firstName: { type: string, minLength: 1, maxLength: 120 }
        lastName: { type: string, minLength: 1, maxLength: 120 }
        preferredName: { type: [string, "null"], maxLength: 120 }
        email:
          type: string
          maxLength: 200
          description: "Loose on purpose: must contain `@`, not first or last."
        phone: { type: [string, "null"], maxLength: 40 }
        dateOfBirth: { type: [string, "null"], format: date, description: "`yyyy-mm-dd`." }
        tags:
          type: [array, "null"]
          maxItems: 20
          description: Lower-cased, trimmed, blanks and repeats dropped; each at most 40 characters.
          items: { type: string }
        importantDates:
          type: [array, "null"]
          maxItems: 12
          items:
            type: object
            required: [label, date]
            properties:
              label: { type: string, minLength: 1, maxLength: 60 }
              date: { type: string, format: date }
              recurring: { type: boolean, description: Only `true` counts; anything else is false. }
        notes: { type: [string, "null"], maxLength: 4000 }
        address:
          type: [object, "null"]
          description: >-
            Mailing address. All of line1, line2, city, region and postal code blank clears
            it; otherwise line1, city and country are required by the table (a missing one
            is a 500 today, as in the Deno function).
          properties:
            line1: { type: [string, "null"], maxLength: 200 }
            line2: { type: [string, "null"], maxLength: 200 }
            city: { type: [string, "null"], maxLength: 120 }
            region: { type: [string, "null"], maxLength: 120 }
            postalCode: { type: [string, "null"], maxLength: 20 }
            country:
              type: [string, "null"]
              maxLength: 2
              description: ISO 3166-1 alpha-2; upper-cased.

    AgentClientCreateRequest:
      type: object
      required: [op, client]
      properties:
        op: { type: string, enum: [create] }
        client: { $ref: '#/components/schemas/AgentClientFields' }

    AgentClientUpdateRequest:
      type: object
      required: [op, clientId, expectedVersion, client]
      properties:
        op: { type: string, enum: [update] }
        clientId: { type: string, format: uuid }
        expectedVersion:
          type: integer
          minimum: 1
          maximum: 2147483647
          description: "`client.version` as the form was rendered from. A mismatch is a 409."
        client:
          $ref: '#/components/schemas/AgentClientFields'
          description: The whole record; every field is overwritten.

    AgentClientArchiveRequest:
      type: object
      required: [op, clientId, expectedVersion, archived]
      properties:
        op: { type: string, enum: [archive] }
        clientId: { type: string, format: uuid }
        expectedVersion: { type: integer, minimum: 1, maximum: 2147483647 }
        archived: { type: boolean, description: True archives; false restores. }
        reason:
          type: [string, "null"]
          maxLength: 500
          description: Kept in the audit row of an archive only (the client table has no column for it).

    AgentClientBulkTagRequest:
      type: object
      required: [op, clientIds, tag, add]
      properties:
        op: { type: string, enum: [bulk_tag] }
        clientIds:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string, format: uuid }
        tag: { type: string, minLength: 1, maxLength: 40, description: Trimmed and lower-cased. }
        add: { type: boolean, description: True adds the tag; false removes it. }

    AgentClientCreateResponse:
      type: object
      required: [outcome]
      properties:
        outcome: { type: string, enum: [created, duplicate_email] }
        clientId:
          type: string
          format: uuid
          description: "`created` only: the new client's id (a v7 minted by the server)."
        existingClientId:
          type: string
          format: uuid
          description: "`duplicate_email` only: the live client in this book with that email."

    AgentClientUpdateResponse:
      type: object
      required: [outcome, version]
      properties:
        outcome: { type: string, enum: [changed, noop, duplicate_email] }
        clientId:
          type: string
          format: uuid
          description: Absent on `duplicate_email`.
        version:
          type: integer
          description: The version after the write (unchanged on `noop` and `duplicate_email`).

    AgentClientArchiveResponse:
      type: object
      required: [outcome, clientId, version]
      properties:
        outcome: { type: string, enum: [archived, restored, noop] }
        clientId: { type: string, format: uuid }
        version: { type: integer }

    AgentClientBulkTagResponse:
      type: object
      required: [outcome, tag, add, changedCount, requestedCount]
      properties:
        outcome: { type: string, enum: [tagged] }
        tag: { type: string, description: The tag as stored (trimmed, lower-cased). }
        add: { type: boolean }
        changedCount: { type: integer, description: Clients that actually changed. }
        requestedCount: { type: integer, description: Ids sent, repeats included. }

    AgentClientNoteRequest:
      type: object
      required: [clientId, op]
      properties:
        clientId: { type: string, format: uuid }
        op: { type: string, enum: [create, update, archive] }
        noteId:
          type: string
          format: uuid
          description: Required on `update` and `archive`; ignored on `create`.
        body:
          type: string
          maxLength: 4000
          description: >-
            Required on `create` and `update`, with something in it besides whitespace (an
            empty body is not a delete). Stored trimmed. Ignored on `archive`.

    AgentClientNoteResponse:
      type: object
      required: [clientId, noteId, changed]
      properties:
        clientId: { type: string, format: uuid }
        noteId: { type: string, format: uuid }
        changed: { type: boolean }
        outcome:
          type: string
          enum: [created, changed, archived]
          description: Present only when `changed` is true.

    AgentTemplateSaveRequest:
      type: object
      required: [op, tripId, name]
      properties:
        op: { type: string, enum: [save] }
        tripId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120, description: Trimmed. }
        description:
          type: [string, "null"]
          maxLength: 500
          description: Trimmed; blank or absent stores none.

    AgentTemplateUpdateRequest:
      type: object
      required: [op, templateId, name]
      properties:
        op: { type: string, enum: [update] }
        templateId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        description:
          type: [string, "null"]
          maxLength: 500
          description: Blank or absent CLEARS the stored description.

    AgentTemplateArchiveRequest:
      type: object
      required: [op, templateId]
      properties:
        op: { type: string, enum: [archive] }
        templateId: { type: string, format: uuid }

    AgentTemplateApplyRequest:
      type: object
      required: [op, templateId, tripId]
      properties:
        op: { type: string, enum: [apply] }
        templateId: { type: string, format: uuid }
        tripId: { type: string, format: uuid }

    AgentTemplateSaveResponse:
      type: object
      required: [templateId, componentsSaved, daysSaved]
      properties:
        templateId: { type: string, format: uuid }
        componentsSaved: { type: integer }
        daysSaved: { type: integer }

    AgentTemplateOutcomeResponse:
      type: object
      required: [outcome]
      properties:
        outcome:
          type: string
          enum: [changed, noop, archived]
          description: "`update` answers changed or noop; `archive` answers archived."

    AgentTemplateApplyResponse:
      type: object
      required: [outcome, componentsAdded, daysAdded, activitiesAdded]
      properties:
        outcome: { type: string, enum: [applied, already_applied] }
        componentsAdded: { type: integer }
        daysAdded: { type: integer, description: 0 when the trip has no start date. }
        activitiesAdded: { type: integer }

    AgentMessageTemplateWriteRequest:
      type: object
      required: [op, templateId, category, name, body]
      properties:
        op: { type: string, enum: [create, update] }
        templateId:
          type: string
          format: uuid
          description: "`create`: a fresh client-minted v7 (older than an hour is a 400). `update`: the template's id."
        category:
          type: string
          enum: [lead_response, proposal, booking_confirmation, pre_trip, post_trip, payment_reminder, other]
        name: { type: string, minLength: 1, maxLength: 80, description: Trimmed. }
        body:
          type: string
          maxLength: 8000
          description: >-
            Kept as written (not trimmed). Every `{{ token }}` must be one of client.firstName,
            trip.name, trip.destination, trip.dates, agent.firstName, payment.label,
            payment.amount, payment.dueDate, payment.link.
        tags:
          type: [array, "null"]
          description: Trimmed; blanks and repeats (ignoring case, first spelling kept) dropped; at most 10 of at most 30 characters.
          items: { type: string }

    AgentMessageTemplateDuplicateRequest:
      type: object
      required: [op, templateId, newTemplateId]
      properties:
        op: { type: string, enum: [duplicate] }
        templateId: { type: string, format: uuid, description: The template to copy. }
        newTemplateId: { type: string, format: uuid, description: A fresh client-minted v7 for the copy. }

    AgentMessageTemplateArchiveRequest:
      type: object
      required: [op, templateId, archived]
      properties:
        op: { type: string, enum: [archive] }
        templateId: { type: string, format: uuid }
        archived: { type: boolean, description: True archives; false restores. }

    AgentMessageTemplateResponse:
      type: object
      required: [outcome]
      properties:
        outcome:
          type: string
          enum: [created, exists, changed, noop]
          description: >-
            `create`: created or exists. `update`: changed or noop. `duplicate`: created or
            exists. `archive`: changed or noop.
        templateId:
          type: string
          format: uuid
          description: "`create`, `update` and `duplicate` (the copy's id); absent on `archive`."

    AgentSettingsProfileRequest:
      type: object
      required: [op, displayName]
      properties:
        op: { type: string, enum: [update_profile] }
        displayName: { type: string, minLength: 1, maxLength: 80, description: Trimmed. }
        pronouns: { type: [string, "null"], maxLength: 30 }
        phone:
          type: [string, "null"]
          maxLength: 30
          description: Digits and `+ - ( ) . x` and spaces, at least 7 digits.
        bio: { type: [string, "null"], maxLength: 600 }
        socialLinks:
          type: [object, "null"]
          additionalProperties: false
          description: >-
            Normalised to https links. Instagram and Facebook take a bare handle or @handle;
            a link without a scheme gets https://; http:// is refused; the three networks
            must link to their own site with a path. Empty values are dropped.
          properties:
            instagram: { type: [string, "null"] }
            facebook: { type: [string, "null"] }
            linkedin: { type: [string, "null"] }
            website: { type: [string, "null"] }

    AgentSettingsAvatarRequest:
      type: object
      required: [op, image]
      properties:
        op: { type: string, enum: [set_avatar] }
        image: { type: string, contentEncoding: base64, description: The photo's bytes. }

    AgentSettingsRemoveAvatarRequest:
      type: object
      required: [op]
      properties:
        op: { type: string, enum: [remove_avatar] }

    AgentSettingsAvailabilityRequest:
      type: object
      required: [op, timeZone, weeklySchedule, responseTimeHours]
      properties:
        op: { type: string, enum: [update_availability] }
        timeZone:
          type: string
          enum: [America/St_Johns, America/Halifax, America/Puerto_Rico, America/New_York, America/Toronto,
                 America/Cancun, America/Chicago, America/Winnipeg, America/Mexico_City, America/Regina,
                 America/Denver, America/Edmonton, America/Phoenix, America/Los_Angeles, America/Vancouver,
                 America/Tijuana, America/Anchorage, Pacific/Honolulu]
        weeklySchedule:
          type: object
          required: [mon, tue, wed, thu, fri, sat, sun]
          additionalProperties: false
          description: Every day, either null (off) or From and To on the half hour, ending after it starts ("24:00" may end one).
          properties:
            mon: { $ref: '#/components/schemas/AgentSettingsDayHours' }
            tue: { $ref: '#/components/schemas/AgentSettingsDayHours' }
            wed: { $ref: '#/components/schemas/AgentSettingsDayHours' }
            thu: { $ref: '#/components/schemas/AgentSettingsDayHours' }
            fri: { $ref: '#/components/schemas/AgentSettingsDayHours' }
            sat: { $ref: '#/components/schemas/AgentSettingsDayHours' }
            sun: { $ref: '#/components/schemas/AgentSettingsDayHours' }
        responseTimeHours:
          type: integer
          description: One of 2, 4, 12, 24 or 48 (anything else is a 400). Written as prose, not an enum, because the Kotlin generator emits enums of strings only.

    AgentSettingsDayHours:
      type: [object, "null"]
      required: [start, end]
      additionalProperties: false
      properties:
        start: { type: string, pattern: '^([01][0-9]|2[0-3]):(00|30)$' }
        end: { type: string, pattern: '^(([01][0-9]|2[0-3]):(00|30)|24:00)$' }

    AgentSettingsSaveTimeOffRequest:
      type: object
      required: [op, timeOffId, startsOn, endsOn]
      properties:
        op: { type: string, enum: [save_time_off] }
        timeOffId:
          type: string
          format: uuid
          description: With `isNew`, a fresh client-minted v7 (older than an hour is a 400); otherwise the block to edit.
        isNew: { type: boolean, description: Only `true` creates. }
        startsOn: { type: string, format: date, description: Today or later in the advisor's zone. }
        endsOn: { type: string, format: date, description: On or after startsOn, at most 366 days in all. }
        label: { type: [string, "null"], maxLength: 80 }
        autoReplyEnabled: { type: [boolean, "null"] }
        autoReplyText:
          type: [string, "null"]
          maxLength: 600
          description: Required when autoReplyEnabled; only `{{return_date}}` may be filled.

    AgentSettingsEndTimeOffRequest:
      type: object
      required: [op, timeOffId]
      properties:
        op: { type: string, enum: [end_time_off] }
        timeOffId: { type: string, format: uuid }

    AgentSettingsNotificationsRequest:
      type: object
      required: [op, clientMessagesPush, clientMessagesEmail, quoteRequestsPush, quoteRequestsEmail]
      properties:
        op: { type: string, enum: [update_notifications] }
        clientMessagesPush: { type: boolean }
        clientMessagesEmail: { type: boolean }
        quoteRequestsPush: { type: boolean }
        quoteRequestsEmail: { type: boolean }

    AgentSettingsSignatureRequest:
      type: object
      required: [op]
      properties:
        op: { type: string, enum: [update_signature] }
        signature:
          type: [string, "null"]
          maxLength: 500
          description: >-
            Plain text, at most 8 lines; only {{agent.name}}, {{agent.phone}} and
            {{agent.email}}. Empty, absent or the default's exact text stores none (the
            default is used).

    AgentSettingsResponse:
      type: object
      required: [outcome]
      properties:
        outcome:
          type: string
          enum: [updated, unchanged, created, deleted, ended]
          description: >-
            `save_time_off`: created, updated or unchanged. `end_time_off`: deleted (it had
            not started) or ended (it was running and now ends yesterday). Every other op:
            updated or unchanged.
        avatarPath:
          type: string
          description: "`set_avatar` only: the stored photo's path, to put on a public Storage origin."
        timeOffId:
          type: string
          format: uuid
          description: "`save_time_off` only."

    # ── §3.7 Commission (ledger and statement import) ──

    # The fields the add and edit forms share. Expected is NOT among them: SQL computes it
    # from gross x rate.
    AgentCommissionLineFields:
      type: object
      required: [supplierId, grossCents, commissionPct, paymentTerms, paymentLagDays]
      properties:
        supplierId: { type: string, format: uuid }
        grossCents:
          oneOf:
            - { type: integer, minimum: 0, maximum: 9999999999 }
            - { type: string, pattern: '^\s*\d+\s*$' }
          description: Gross booking value in cents. Required (absent or blank is a 400, never $0).
        commissionPct:
          oneOf:
            - { type: number, minimum: 0, maximum: 100 }
            - { type: string }
          description: 0 to 100; rounded to two decimals. Required.
        paymentTerms: { type: string, enum: [at_booking, after_travel] }
        paymentLagDays:
          oneOf:
            - { type: integer, minimum: 0, maximum: 365 }
            - { type: string }
          description: Whole days from 0 to 365.
        inteletravelReference:
          type: [string, 'null']
          maxLength: 64
          description: Trimmed; blank is none. Unique per advisor.
        notes:
          type: [string, 'null']
          maxLength: 4000
          description: Trimmed; blank is none. Never exported.

    AgentCommissionCreateRequest:
      allOf:
        - $ref: '#/components/schemas/AgentCommissionLineFields'
        - type: object
          required: [op, tripId]
          properties:
            op: { type: string, enum: [create] }
            tripId: { type: string, format: uuid }
            status:
              type: [string, 'null']
              enum: [expected, invoiced, null]
              default: expected

    AgentCommissionUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/AgentCommissionLineFields'
        - type: object
          required: [op, commissionId, expectedVersion, status]
          properties:
            op: { type: string, enum: [update] }
            commissionId: { type: string, format: uuid }
            expectedVersion: { type: integer, minimum: 1, maximum: 2147483647 }
            status:
              type: string
              enum: [expected, invoiced, received, disputed, lost]
              description: >-
                Moving to received or disputed is the payment op's (a 400 here). Moving a paid
                line back to expected / invoiced / lost clears its payment, and only with
                `clearPayment: true`; without it the outcome is `payment_would_clear`.
            clearPayment:
              type: boolean
              description: Only the JSON value true counts; anything else is false.

    AgentCommissionPaymentRequest:
      type: object
      required: [op, commissionId, expectedVersion, status, receivedCents, receivedAt]
      properties:
        op: { type: string, enum: [payment] }
        commissionId: { type: string, format: uuid }
        expectedVersion: { type: integer, minimum: 1, maximum: 2147483647 }
        status: { type: string, enum: [received, disputed] }
        receivedCents:
          oneOf:
            - { type: integer, minimum: 0, maximum: 9999999999 }
            - { type: string }
          description: Required. `received` with 0 is a 400 (record it as disputed instead).
        feeCents:
          oneOf:
            - { type: integer, minimum: 0, maximum: 9999999999 }
            - { type: string }
            - { type: 'null' }
          description: Optional; absent or blank is 0.
        receivedAt:
          type: string
          format: date
          description: A real calendar date. One after the advisor's today is the `bad_date` outcome.

    AgentCommissionRemoveRequest:
      type: object
      required: [op, commissionId, expectedVersion]
      properties:
        op: { type: string, enum: [remove] }
        commissionId: { type: string, format: uuid }
        expectedVersion: { type: integer, minimum: 1, maximum: 2147483647 }

    AgentCommissionExportRequest:
      type: object
      required: [op]
      properties:
        op: { type: string, enum: [export] }
        filters:
          type: [object, 'null']
          description: The ledger's filters, as the web's ledgerQueryFromParams writes them. All optional.
          properties:
            statuses:
              type: [array, 'null']
              items: { type: string, enum: [expected, invoiced, received, disputed, lost] }
              description: Repeats are dropped; an empty list is every status.
            supplierId: { type: [string, 'null'], description: 'A uuid; blank is none.' }
            tripId: { type: [string, 'null'], description: 'A uuid; blank is none.' }
            travelFrom: { type: [string, 'null'], description: 'A date (trip start on or after); blank is none.' }
            travelTo: { type: [string, 'null'], description: 'A date (trip start on or before); blank is none.' }

    AgentCommissionStageWeights:
      type: object
      required: [inquiry, proposal, booked, in_progress]
      additionalProperties: false
      properties:
        inquiry: { type: integer, minimum: 0, maximum: 100 }
        proposal: { type: integer, minimum: 0, maximum: 100 }
        booked: { type: integer, minimum: 0, maximum: 100 }
        in_progress: { type: integer, minimum: 0, maximum: 100 }

    AgentCommissionWeightsRequest:
      type: object
      required: [op, expected, weights]
      properties:
        op: { type: string, enum: [weights] }
        expected:
          $ref: '#/components/schemas/AgentCommissionStageWeights'
          description: The weights the screen showed. If the stored ones differ, the save is a 409.
        weights:
          $ref: '#/components/schemas/AgentCommissionStageWeights'

    AgentCommissionCreateResponse:
      type: object
      required: [outcome]
      properties:
        outcome: { type: string, enum: [created, duplicate_reference, supplier_not_found] }
        commissionId:
          type: string
          format: uuid
          description: Only on `created`. Minted by the server (v7).
        version: { type: integer, description: 'Only on `created`: always 1.' }

    AgentCommissionLineResponse:
      type: object
      description: "`update` and `remove`. `commissionId` is echoed as it was sent."
      required: [outcome, commissionId, version]
      properties:
        outcome:
          type: string
          enum: [changed, noop, supplier_not_found, duplicate_reference, payment_would_clear, removed, not_removable]
        commissionId: { type: string, format: uuid }
        version:
          type: integer
          description: The line's version now (after the write on changed / removed).

    AgentCommissionPaymentResponse:
      type: object
      required: [outcome, commissionId, version, gapCents]
      properties:
        outcome: { type: string, enum: [recorded, noop, bad_date] }
        commissionId: { type: string, format: uuid }
        version: { type: integer }
        gapCents:
          type: [string, 'null']
          pattern: '^-?\d+$'
          description: Expected - fee - received, in cents as a digit-string. Null on `bad_date`.

    AgentCommissionExportResponse:
      type: object
      required: [outcome, rowCount, csv]
      properties:
        outcome: { type: string, enum: [exported] }
        rowCount: { type: integer }
        csv:
          type: string
          description: >-
            RFC 4180, CRLF line ends with a trailing CRLF, no byte-order mark. Money as exact
            decimals ("1234.56"); a text cell starting with = + - @ tab or CR is prefixed with
            an apostrophe. Notes are not exported.

    AgentCommissionWeightsResponse:
      type: object
      required: [outcome]
      properties:
        outcome: { type: string, enum: [saved, noop] }

    CommissionImportUploadRequest:
      type: object
      required: [op, filename, fileBase64]
      properties:
        op: { type: string, enum: [upload] }
        filename:
          type: string
          description: The name the advisor will recognise. Path parts are dropped; at most 255 characters kept.
        fileBase64:
          type: string
          description: "The CSV's bytes, base64 (forgiving: white space and padding as atob takes them)."

    CommissionImportColumnMap:
      type: object
      description: Statement field to a 0-based column of the file. `received` is required; null is unmapped.
      additionalProperties: false
      properties:
        reference: { type: [integer, 'null'], minimum: 0 }
        supplier: { type: [integer, 'null'], minimum: 0 }
        traveler: { type: [integer, 'null'], minimum: 0 }
        gross: { type: [integer, 'null'], minimum: 0 }
        received: { type: [integer, 'null'], minimum: 0 }
        fee: { type: [integer, 'null'], minimum: 0 }
        paid_on: { type: [integer, 'null'], minimum: 0 }

    CommissionImportMapRequest:
      type: object
      required: [op, importId, expectedVersion, columnMap]
      properties:
        op: { type: string, enum: [map] }
        importId: { type: string, format: uuid }
        expectedVersion: { type: integer, minimum: 1, maximum: 2147483647 }
        columnMap: { $ref: '#/components/schemas/CommissionImportColumnMap' }
        statementDate:
          type: [string, 'null']
          format: date
          description: >-
            The paid-on date for rows with none. Blank or null is none. Required when no
            `paid_on` column is mapped.

    CommissionImportResolveRequest:
      type: object
      required: [op, importId, expectedVersion, action, rowId]
      properties:
        op: { type: string, enum: [resolve] }
        importId: { type: string, format: uuid }
        expectedVersion: { type: integer, minimum: 1, maximum: 2147483647 }
        action: { type: string, enum: [confirm, match, create, ignore] }
        rowId: { type: string, format: uuid }
        commissionId:
          type: string
          format: uuid
          description: "`match` only: the unpaid line this row pays."
        tripId: { type: string, format: uuid, description: "`create` only." }
        supplierId: { type: string, format: uuid, description: "`create` only." }
        grossCents:
          oneOf:
            - { type: integer, minimum: 0, maximum: 9999999999 }
            - { type: string }
          description: "`create` only; required."
        commissionPct:
          oneOf:
            - { type: number, minimum: 0, maximum: 100 }
            - { type: string }
          description: "`create` only; required, rounded to two decimals."

    CommissionImportStatementRequest:
      type: object
      description: "`reconcile` and `discard`."
      required: [op, importId, expectedVersion]
      properties:
        op: { type: string, enum: [reconcile, discard] }
        importId: { type: string, format: uuid }
        expectedVersion: { type: integer, minimum: 1, maximum: 2147483647 }

    CommissionImportUploadResponse:
      type: object
      required: [outcome, importId]
      properties:
        outcome: { type: string, enum: [uploaded, duplicate_file] }
        importId:
          type: string
          format: uuid
          description: The new statement's id, or (`duplicate_file`) the earlier one's.
        rowCount: { type: integer, description: "`uploaded` only: the data rows read." }
        uploadedAt:
          type: string
          format: date-time
          description: "`duplicate_file` only: when the earlier statement was uploaded."

    CommissionImportResponse:
      type: object
      description: "`map`, `resolve` and `discard`. `importId` is echoed as it was sent."
      required: [outcome, importId, version]
      properties:
        outcome:
          type: string
          enum: [mapped, resolved, discarded, not_open, not_allowed, line_unavailable, trip_not_found, supplier_not_found]
        importId: { type: string, format: uuid }
        version:
          type: integer
          description: The statement's version now. Send it as the next `expectedVersion`.

    CommissionImportReconcileResponse:
      type: object
      required: [outcome, importId, version, paid, created, alreadyRecorded, blocking]
      properties:
        outcome: { type: string, enum: [reconciled, needs_decisions, not_open] }
        importId: { type: string, format: uuid }
        version: { type: integer }
        paid: { type: integer, description: Lines marked received. }
        created: { type: integer, description: Lines created and marked received. }
        alreadyRecorded: { type: integer }
        blocking:
          type: integer
          description: "`needs_decisions`: rows still suggested, unmatched, duplicate or unreadable."

    # ── §3.11 Reports and the Export Center ──

    AgentReportExportRequest:
      type: object
      required: [op, report]
      properties:
        op: { type: string, enum: [export] }
        report: { type: string, enum: [revenue, suppliers, destinations, clients, funnel, pipeline] }
        period:
          type: [string, 'null']
          enum: [ytd, 12mo, qtd, null]
          description: >-
            Required for every report but clients and pipeline, which take none (one sent is a
            400, not ignored).
        basis:
          type: [string, 'null']
          enum: [booked, received, null]
          description: Required for revenue; refused for every other report.

    AgentReportCenterRequest:
      type: object
      required: [op, type]
      properties:
        op: { type: string, enum: [center] }
        type: { type: string, enum: [ledger, trips, milestones, clients] }
        from:
          type: [string, 'null']
          format: date
          description: Required (a real date, on or before `to`) for every type but clients, which takes none.
        to:
          type: [string, 'null']
          format: date
        includeContact:
          type: [boolean, 'null']
          description: >-
            Adds email, phone and mailing address columns. Clients only; true on any other
            type is a 400. Only the JSON values true, false and null are accepted.

    AgentReportFile:
      type: object
      required: [outcome, rowCount, csv, fileName]
      properties:
        outcome: { type: string, enum: [exported] }
        rowCount:
          type: integer
          description: The rows SQL returned (for the funnel, the four stages; for the pipeline, stages plus month buckets).
        csv: { type: string }
        fileName:
          type: string
          description: >-
            "revenue-booked-2026-01-01-to-2026-10-21.csv": the period it covers. Clients and
            the pipeline are dated by the advisor's own day ("clients-lifetime-value-2026-10-21.csv",
            "clients-with-contact-details-2026-10-21.csv").

  responses:
    BadRequest:
      description: The request body or query failed validation.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: No such record, or none the caller may see. The two are deliberately indistinguishable.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Missing or invalid access token.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Authenticated, but the caller's role may not perform this action.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: >-
        The row moved since the caller read it. Distinct from a 400 on purpose: the
        request was well formed and the caller did nothing wrong, so the remedy is a
        reload rather than a correction.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
