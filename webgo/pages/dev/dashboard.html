<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Signed in (development)</title>
</head>
<body>
<main>
  <!--
    Development-only page, mounted at /dashboard when STA_ENV=development and Supabase is
    configured, to show what the session knows. The real dashboard replaces it in Phase 4.
  -->
  <h1>Signed in</h1>
  <dl>
    <dt>Email</dt>
    <dd data-slot="email">sample@example.com</dd>
    <dt>User id</dt>
    <dd data-slot="user-id">sample-user-id</dd>
    <dt>Second factor</dt>
    <dd data-slot="assurance">sample</dd>
  </dl>
  <form method="post" action="/account/sign-out">
    <p><button type="submit">Sign out</button></p>
  </form>
</main>
</body>
</html>
