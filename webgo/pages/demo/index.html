<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Page builder demo</title>
</head>
<body>
<main>
  <!--
    Development-only demo of internal/page, served at /_demo when STA_ENV=development.
    It proves the pipeline end to end: a layout, slots, a repeat, an empty state, and
    hostile values that must arrive as text. Delete it in Phase 2 (docs/GO-MIGRATION.md).
  -->
  <h1 data-slot="trip-title">Sample trip name</h1>
  <p>Traveler: <strong data-slot="traveler">Sample traveler</strong></p>

  <h2>Stops</h2>
  <ul>
    <li data-repeat="stops"><a data-slot="stop-link" href="#sample-stop"><span data-slot="stop-name">Sample stop</span></a></li>
  </ul>
  <p data-slot="no-stops">No stops yet.</p>

  <h2>Payment</h2>
  <p><a data-slot="pay-link" href="#sample-pay-link">Pay the supplier</a></p>

  <h2>Notes</h2>
  <form method="post" action="/_demo">
    <label>Notes <textarea name="notes" data-slot="notes">Sample notes</textarea></label>
  </form>
</main>
</body>
</html>
