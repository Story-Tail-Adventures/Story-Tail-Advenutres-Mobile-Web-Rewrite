<script>
// Header toggles own the canvas theme + viewport. Both persist per-browser and
// broadcast the same events the canvas (and the Tweaks panel) listen for.
(function(){
  var KT='st-theme', KV='st-view';
  window.__stTheme = localStorage.getItem(KT) || 'light';
  window.__stView  = localStorage.getItem(KV) || 'web';
  function paint(seg, attr, val){
    if(!seg) return;
    seg.querySelectorAll('button').forEach(function(b){
      b.classList.toggle('is-on', b.getAttribute(attr) === val);
    });
  }
  function boot(){
    var ts=document.getElementById('theme-seg'), vs=document.getElementById('view-seg');
    paint(ts,'data-theme',window.__stTheme); paint(vs,'data-view',window.__stView);
    if(ts) ts.addEventListener('click',function(e){
      var b=e.target.closest('button[data-theme]'); if(!b) return;
      window.__stTheme=b.getAttribute('data-theme');
      localStorage.setItem(KT,window.__stTheme);
      paint(ts,'data-theme',window.__stTheme);
      window.dispatchEvent(new CustomEvent('st-theme-change',{detail:window.__stTheme}));
    });
    if(vs) vs.addEventListener('click',function(e){
      var b=e.target.closest('button[data-view]'); if(!b) return;
      window.__stView=b.getAttribute('data-view');
      localStorage.setItem(KV,window.__stView);
      paint(vs,'data-view',window.__stView);
      window.dispatchEvent(new CustomEvent('st-view-change',{detail:window.__stView}));
    });
    window.addEventListener('st-theme-change',function(e){window.__stTheme=e.detail;localStorage.setItem(KT,e.detail);paint(ts,'data-theme',e.detail);});
    window.addEventListener('st-view-change',function(e){window.__stView=e.detail;localStorage.setItem(KV,e.detail);paint(vs,'data-view',e.detail);});
  }
  document.readyState==='loading'?document.addEventListener('DOMContentLoaded',boot):boot();
})();
</script>

  function useTheme() {
    const [theme, setTheme] = React.useState(window.__stTheme || 'light');
    React.useEffect(() => {
      const h = (e) => setTheme(e.detail);
      window.addEventListener('st-theme-change', h);
      return () => window.removeEventListener('st-theme-change', h);
    }, []);
    return theme;
  }
  function useView() {
    const [view, setView] = React.useState(window.__stView || 'web');
    React.useEffect(() => {
      const h = (e) => setView(e.detail);
      window.addEventListener('st-view-change', h);
      return () => window.removeEventListener('st-view-change', h);
    }, []);
    return view;
  }
  function Scheme({ scheme, children, bg }) {
    const themed = useTheme();
    const mode = scheme || themed;
    return (
      <div className={mode === 'dark' ? 'scheme-dark' : ''}
           style={{ width: '100%', height: '100%', background: bg || 'var(--md-bg)', color: 'var(--md-on-surface)', overflow: 'hidden' }}>
        {children}
      </div>
    );
  }
  function Stub({ label }) {
    return <div style={{ width:'100%', height:'100%', display:'flex', alignItems:'center', justifyContent:'center', background: 'var(--md-surface-2)', color: 'var(--md-on-surface-variant)', font: '600 16px/1 var(--font-sans)' }}>{label}</div>;
  }

    const theme = useTheme();

    const useMobile = mobile || (view === 'mobile' && mobileScreens && mobileScreens.length);

          if (useMobile || s.mobile) {
            return (
              <DCArtboard key={s.id} id={s.id} label={s.label} width={420} height={900}>

            <DCArtboard key={s.id} id={s.id} label={s.label} width={w} height={h}>
