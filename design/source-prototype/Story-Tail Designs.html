  function Scheme({ scheme, children, bg }) {
    return (
      <div className={scheme === 'dark' ? 'scheme-dark' : ''}
           style={{ width: '100%', height: '100%', background: bg || 'var(--md-bg)', color: 'var(--md-on-surface)', overflow: 'hidden' }}>
        {children}
      </div>
    );
  }
  function Stub({ label }) {
    return <div style={{ width:'100%', height:'100%', display:'flex', alignItems:'center', justifyContent:'center', background: 'var(--md-surface-2)', color: 'var(--md-on-surface-variant)', font: '600 16px/1 var(--font-sans)' }}>{label}</div>;
  }
  function Section({ id, title, subtitle, screens, width = 1280, height = 820, mobile = false }) {
    return (
      <DCSection id={id} title={title} subtitle={subtitle}>
        {screens.map((s) => {
          const Comp = window[s.comp];
          const w = s.w || width;
          const h = s.h || height;
          if (mobile || s.mobile) {
            return (
              <React.Fragment key={s.id}>
                <DCArtboard id={`${s.id}-light`} label={`${s.label} · Light`} width={420} height={900}>
                  {Comp ? <Comp dark={false}/> : <Stub label={s.label}/>}
                </DCArtboard>
                <DCArtboard id={`${s.id}-dark`} label={`${s.label} · Dark`} width={420} height={900}>
                  {Comp ? <Comp dark={true}/> : <Stub label={s.label}/>}
                </DCArtboard>
              </React.Fragment>
            );
          }
          return (
            <React.Fragment key={s.id}>
              <DCArtboard id={`${s.id}-light`} label={`${s.label} · Light`} width={w} height={h}>
                {Comp ? <Scheme scheme="light"><Comp/></Scheme> : <Stub label={s.label}/>}
              </DCArtboard>
              <DCArtboard id={`${s.id}-dark`} label={`${s.label} · Dark`} width={w} height={h}>
                {Comp ? <Scheme scheme="dark"><Comp/></Scheme> : <Stub label={s.label}/>}
              </DCArtboard>
            </React.Fragment>
          );
        })}
      </DCSection>
    );
  }
