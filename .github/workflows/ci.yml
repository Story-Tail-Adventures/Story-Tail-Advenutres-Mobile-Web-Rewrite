# Story-Tail Adventures — CI
#
# Everything here runs against a throwaway local stack, so the PR workflow needs ZERO
# secrets. That is deliberate; keep it that way. Secrets enter only with the deploy
# workflow, and STRIPE_SECRET_KEY never enters GitHub at all — it lives in Supabase's
# secret store (see supabase/README.md).
name: CI

on:
  pull_request:
  # `production` is here because deploy.yml gates on this workflow's conclusion for that
  # branch. Drop it and the deploy silently stops firing rather than failing. `main` is gone:
  # it never existed on the remote, so it could never have fired either.
  push:
    branches: [dev, production]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  # Cheap and deterministic, so it runs first and fails fast.
  pci-guard:
    name: PCI guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Strips SQL comments and string literals first. A plain grep fires on the initial
      # migration's own "NEVER store PAN, CVV" comment — text that states the rule
      # rather than breaking it, and a guard that fails on that gets deleted.
      - name: No card-data columns in migrations
        run: python3 .github/scripts/scan_card_columns.py

      - name: No Stripe secret keys in the tree
        run: |
          if grep -rnE 'sk_(live|test)_[A-Za-z0-9]{8,}' \
               --exclude-dir=node_modules --exclude-dir=.git . 2>/dev/null; then
            echo "::error::Stripe secret key literal committed. Use \`supabase secrets set\`."
            exit 1
          fi

      # The write hooks in .claude/hooks/ only protect Claude's writes. This is the
      # same check for a human's commit.
      # Before the scan, not after: the scanner carves out UUIDs, Unsplash ids and
      # migration timestamps, and each carve-out is a hole the guard must be proved not to
      # have widened. The self-test asserts both directions — 4242… still caught, a
      # Luhn-valid migration stamp still quiet.
      - name: PAN scanner does what it claims
        run: python3 .github/scripts/scan_pan.py --self-test

      - name: No Luhn-valid card numbers in source
        run: python3 .github/scripts/scan_pan.py

  copy-parity:
    name: Web/mobile copy parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # web/ and mobile/ hold deliberately parallel implementations of the same
      # validation rules and error taxonomy (the KMP module does not run on web).
      # The unit tests on each side cover behaviour; this covers wording, so the same
      # person never sees different copy on their phone and in the browser.
      - name: User-facing strings match across platforms
        run: python3 .github/scripts/check_copy_parity.py

      # Some auth settings are preference; these five are load-bearing. Flipping one
      # produces no error anywhere — just a security hole or a screen that quietly stops
      # working — so the coupling is asserted rather than left to a code comment.
      - name: Auth config matches what the app assumes
        run: python3 .github/scripts/check_auth_config.py

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w web
      - run: npm run lint -w web
      - run: npm run test -w web
      # next/font/google fetches the typefaces at build time, so this step needs
      # network egress. That is the tradeoff for not loading them at runtime.
      #
      # `next build` runs as NODE_ENV=production, and env.siteUrl fails closed there so a
      # real deploy can never ship wrong canonical URLs, sitemap entries or email-confirm
      # redirects. CI has no .env.local, so it has to pass the origin in. Not a secret, and
      # nothing here is deployed — the deployment sets its own value.
      - run: npm run build -w web
        env:
          NEXT_PUBLIC_SITE_URL: https://app.story-tail.com

  contracts:
    name: Contracts codegen is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run generate -w contracts
      - name: Fail if generated types drifted from openapi.yaml
        run: git diff --exit-code contracts/ts/

  public-content:
    name: Public content codegen is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # web/content/public/*.ts is the single source of truth for Screen Inventory §2.0's
      # curated catalog and copy; the Kotlin the app reads is generated from it. Without
      # this job a change to a price, a trip name or a legal paragraph would ship to the
      # browser and not to the phone — the drift check_copy_parity.py exists to catch,
      # for the content it does not cover.
      - run: npm run generate:public-content -w web
      - name: Fail if the generated Kotlin drifted from web/content/public
        run: git diff --exit-code mobile/shared/src/commonMain/kotlin/com/storytail/adventures/content/public/GeneratedPublicContent.kt

  mobile-android:
    name: Mobile (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # 21, not 17: mobile/gradle/gradle-daemon-jvm.properties pins toolchain 21.
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      - name: Assemble + unit tests
        working-directory: mobile
        # These are the AGP KMP library plugin's task names. `:shared:build` and
        # `:shared:check` pull in the iOS link step and cannot run here.
        run: ./gradlew :androidApp:assembleDebug :shared:testAndroidHostTest --no-daemon

  mobile-ios-compile:
    name: Mobile (iOS klib)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v5
      # Compiles the klib without linking a framework. This is the gate that catches
      # iOS-incompatible shared code AND dependency klibs whose ABI version is newer
      # than the project's Kotlin compiler — a mismatch the JVM target silently
      # tolerates. It has already caught one real dependency pin.
      #
      # macOS runners bill at 10x on private repos. If that becomes a cost problem,
      # move this job to `push` only and drop it from `pull_request`.
      - name: Compile shared for iOS
        working-directory: mobile
        run: ./gradlew :shared:compileKotlinIosSimulatorArm64 --no-daemon

  supabase:
    name: Supabase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: supabase/setup-cli@v1
        with:
          # Pinned, not `latest`. `latest` asks the GitHub releases API on every run, which
          # rate-limited and failed this job in 7s with nothing to do with Supabase or the
          # hosted project — and it silently changes the tool that validates our migrations
          # between one green run and the next. 2.116.0 is the version these migrations have
          # actually been replayed against locally. Bump deliberately.
          version: 2.116.0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Full replay from an empty database. Catches ordering bugs that an incremental
      # apply hides, and proves seed.sql still matches the schema.
      - name: Start database and replay all migrations
        run: supabase db start

      - name: Lint schema
        run: supabase db lint --level warning

      # Executes each policy as each role rather than just reading the SQL. A policy that
      # passes the happy path and leaks to another user looks identical to a correct one
      # until you run it as that user.
      # Globbed rather than listed: a test file that is written but never wired into CI
      # is worse than no test, because it reads as covered.
      - name: RLS policies enforce isolation
        run: |
          shopt -s nullglob
          db_url="$(supabase status -o json | jq -r .DB_URL)"
          for f in supabase/tests/*.sql; do
            echo "── $f"
            psql "$db_url" -v ON_ERROR_STOP=1 -f "$f"
          done

      # Checks the _shared/ helpers too, not just function entry points — they are where
      # the audit and auth rules actually live.
      - name: Typecheck and lint Edge Functions
        run: |
          shopt -s nullglob
          files=(supabase/functions/*/index.ts supabase/functions/_shared/*.ts)
          if [ ${#files[@]} -eq 0 ]; then
            echo "Nothing to check yet."
            exit 0
          fi
          # --config explicitly: without it Deno resolves the config by walking up from
          # the CWD, finds no deno.json at the repo root, and the bare
          # "@supabase/supabase-js" specifier fails to resolve.
          deno check --config supabase/functions/deno.json "${files[@]}"
          deno lint --config supabase/functions/deno.json supabase/functions/

      # The _shared/ rules that are PARALLEL IMPLEMENTATIONS of a web/ rule — today the
      # E.164 phone normalisation in _shared/onboarding.ts, whose twin is
      # web/lib/validation/profile.ts. Deno cannot import from web/, so the only thing
      # keeping the two honest is the same vectors asserted on both sides.
      # --allow-env: _shared/cors.ts reads the allowed origin at module load.
      - name: Test Edge Function helpers
        run: |
          shopt -s nullglob globstar
          tests=(supabase/functions/**/*_test.ts)
          if [ ${#tests[@]} -eq 0 ]; then
            echo "No Deno tests yet."
            exit 0
          fi
          deno test --allow-env --config supabase/functions/deno.json supabase/functions/

      # Deploying the functions is Supabase's job, driven by config.toml — and the docs say it
      # deploys the ones "declared in config.toml". A function directory with no
      # [functions.<slug>] block may therefore never reach production, and nothing else would
      # notice: GitHub is green because it never touched Supabase, Supabase is green because
      # it deployed what it was told to, and the absence shows up as a 404 in a traveler's
      # browser. The next function added is the one this catches.
      - name: Every Edge Function is declared for deployment
        run: |
          shopt -s nullglob
          for d in supabase/functions/*/; do
            slug="$(basename "$d")"
            # _shared/ and friends are libraries, not deployable functions.
            case "$slug" in _*) continue;; esac
            grep -q "^\[functions\.${slug}\]" supabase/config.toml || {
              echo "::error::supabase/functions/${slug}/ has no [functions.${slug}] block in supabase/config.toml."
              exit 1
            }
          done

      - name: Fail if generated DB types drifted from the migrations
        run: |
          npm ci
          npm run supabase:types
          # Both copies: the script writes web/types/ AND functions/_shared/, so diffing
          # only the first would let a hand-edit to the Edge Function types through.
          git diff --exit-code web/types/supabase.ts \
                               supabase/functions/_shared/database.types.ts
