# Story-Tail Adventures — production frontend deploy + release record
#
# This workflow owns HALF a deployment. The other half — migrations and Edge Functions — is
# applied server-side by Supabase's GitHub integration when `production` moves, over its own
# OAuth connection. That split is why there is no `supabase link`, no `supabase db push` and
# no SUPABASE_* credential below: a database password that never enters GitHub cannot leak
# from GitHub. ci.yml's header says "Secrets enter only with the deploy workflow" — there is
# exactly one here, and it is Vercel's.
#
# Because the two halves run on separate machines with separate logs, the release cut at the
# end is the only place the whole of a deploy is written down together. That is what it is
# for; it is not decoration.
name: Deploy

on:
  # Not `push`. A push trigger races CI, so a commit that fails typecheck, the RLS isolation
  # tests or the PAN guard could reach users before CI has an opinion about it.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [production]

  # Re-deploy the current tree without inventing an empty commit: a rolled-back deployment,
  # a rotated anon key, or a red CI job in a stack this deploy does not touch (an iOS klib
  # failure should not hold a web hotfix hostage).
  # dry_run stops after `vercel build` — the only way to exercise the monorepo build path
  # without putting the result in front of anyone.
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build only, do not deploy
        type: boolean
        default: false

concurrency:
  # The `-dry` suffix keeps dry runs out of the real deploy queue. GitHub holds at most ONE
  # pending run per group and cancels the previous one, so a dispatched dry run sharing this
  # group would silently evict a deploy queued behind an in-progress one — and it would
  # report as "cancelled", not failed, so nothing would go red. On workflow_run,
  # `inputs.dry_run` is empty, so the suffix folds away and the push path's group is unchanged.
  group: deploy-production${{ inputs.dry_run && '-dry' || '' }}
  # Deliberately NOT cancel-in-progress, the opposite of ci.yml's concurrency block.
  # `vercel deploy` is not atomic from here; killing it between the upload and the alias
  # promotion leaves a deployment that exists, is half-wired, and answers nothing. Queue.
  cancel-in-progress: false

# contents: write is for the release and its tag, and is the only write this needs.
permissions:
  contents: write

env:
  NODE_VERSION: "22"

  # Pinned, not @latest. Vercel ships CLI releases weekly, and how it resolves a monorepo
  # lockfile is exactly the behaviour that changes. With @latest, two identical commits can
  # deploy differently and the first evidence is a broken production site.
  VERCEL_CLI_VERSION: "59.11.7"

  # The one origin the whole deploy is measured against — the single place to change it.
  #
  # The Vercel-assigned production alias. The eventual home is adventures.story-tail.com
  # pointed here; app.story-tail.com is NOT being created, despite docs/BRD.md:74 and the
  # TODO at docs/Tech-Recommendations.md:523 (both get corrected as part of that move).
  #
  # Unbranded until then, because web/app/seo.ts:77 serves `allow: "/"` — whatever origin
  # this names is crawlable, and web/content/public/proof.ts still reports unverified claims,
  # placeholder prices and unlicensed photos. Those do not belong on the brand domain, least
  # of all one that already has traffic.
  #
  # Vercel's default alias for project `storytailadventures` (Hobby scope
  # gyasistorys-projects). The Domains tab is empty because nothing has been deployed to
  # production yet — Vercel creates this alias on the first --prod deploy. Until then it
  # answers 404 DEPLOYMENT_NOT_FOUND, which is expected, not a misconfiguration.
  SITE_ORIGIN: "https://storytailadventures.vercel.app"

  # How the CLI finds the project with no .vercel/ in the repo: it falls back to these two
  # env vars, and `vercel pull` then WRITES .vercel/project.json onto the runner from them.
  # Nothing under .vercel/ is committed — Vercel's own README in that folder says not to
  # share it, and `vercel pull` drops .env.production.local (every production value in
  # plaintext) into the same directory.
  #
  # Stored as secrets rather than variables. They are identifiers, not credentials — neither
  # grants access to anything on its own — so repository *variables* would be the tidier home
  # and would keep them legible in the log. They are secrets because that is where they were
  # created, and the difference is cosmetic: the only cost is that GitHub masks them as ***
  # wherever the Vercel CLI echoes a project id back. Move them to the Variables tab and flip
  # these two lines to `vars.` if that masking ever gets in the way of debugging.
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  vercel:
    name: Vercel production
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Three conditions, not one.
    #   conclusion  — workflow_run fires on completion, INCLUDING failure and cancellation.
    #   event       — ci.yml also runs on `pull_request`, so a PR opened from a branch that
    #                 happens to be named `production` carries head_branch == 'production'
    #                 straight past the `branches:` filter above.
    #   head_branch — belt and braces with that filter, which has a history of surprises.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'production')

    steps:
      # THE bug this workflow is one line away from. A workflow_run job runs the file from
      # the DEFAULT branch and defaults github.sha to the default branch's head — so a bare
      # checkout builds `dev` and ships it to production, silently, on every green CI run.
      # head_sha is the commit CI actually tested.
      # fetch-depth: 0 because the release step diffs against the previous tag.
      # persist-credentials: false because the next steps run `vercel build`, which executes
      # this project's own install and build — i.e. third-party code from node_modules, with
      # the workspace as cwd. The default leaves a contents:write GITHUB_TOKEN in
      # .git/config's extraheader for that code to read. Nothing here needs authenticated
      # git: the release step talks to the REST API with GH_TOKEN, and the rest is local
      # rev-parse / describe / diff, which fetch-depth: 0 has already satisfied.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      # The failure mode this repo has already shipped once: the draft of this file carried
      # `SUPABASE_PROJECT_ID: "your-supabase-project-ref-id"` for its whole life because
      # nothing complained. A placeholder that fails loudly is a placeholder; one that fails
      # quietly is a bug waiting for a deploy.
      - name: SITE_ORIGIN has been filled in
        run: |
          case "$SITE_ORIGIN" in
            *REPLACE-ME*)
              echo "::error::SITE_ORIGIN is still the placeholder. Set it to the Vercel"
              echo "::error::production alias (Project -> Domains) in .github/workflows/deploy.yml."
              exit 1
              ;;
          esac

      # A manual dispatch runs this file from whichever branch the UI dropdown had selected,
      # and checks that branch out. Shipping `dev` to production is one dropdown away; a dry
      # run from anywhere is harmless and stays allowed.
      - name: Refuse a manual deploy of a non-production ref
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
        run: |
          if [ "${{ github.ref_name }}" != "production" ]; then
            echo "::error::Dispatch a real deploy from 'production'; got '${{ github.ref_name }}'."
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm install --global vercel@${{ env.VERCEL_CLI_VERSION }}

      # Run from the repo ROOT — never `--cwd ./web`. The Vercel project's Root Directory is
      # already `web`, so --cwd would resolve it a second time and look for web/web. And web/
      # has no lockfile of its own: the only package-lock.json is at the repo root, so an
      # install rooted at web/ has nothing deterministic to install from.
      - name: Pull the production environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      # The CLI is invoked from the REPO ROOT, never `--cwd ./web`, because `vercel build`
      # joins its cwd with the project's own rootDirectory — so --cwd ./web on top of a Root
      # Directory of `web` resolves to web/web. Running at the root is also what Vercel's Git
      # integration does: it never cd's into a subdirectory, it applies rootDirectory itself.
      #
      # That makes rootDirectory == "web" a hard dependency of this workflow rather than a
      # dashboard preference. Unset, the build would try to build the repo root — which has no
      # Next app — and fail somewhere confusing, several minutes later. Assert it here, where
      # the message names the setting and the page to change it on.
      #
      # `jq .settings`, not `cat` — project.json also carries the org and project ids.
      - name: Vercel Root Directory is web
        run: |
          set -euo pipefail
          jq '.settings' .vercel/project.json
          root="$(jq -r '.settings.rootDirectory // "null"' .vercel/project.json)"
          if [ "$root" != "web" ]; then
            echo "::error::Vercel Root Directory is '$root', expected 'web'."
            echo "::error::Set it at Project Settings -> General -> Root Directory, then re-run."
            echo "::error::This workflow runs the CLI from the repo root and relies on that setting"
            echo "::error::to locate the Next app — web/ has no lockfile of its own."
            exit 1
          fi

      # The trap this step exists for: NO prerendered route reads NEXT_PUBLIC_SUPABASE_URL or
      # NEXT_PUBLIC_SUPABASE_ANON_KEY, so a build missing them is GREEN. Then web/lib/env.ts
      # throws inside the proxy (web/lib/supabase/middleware.ts) on the first real request and
      # every page 500s. Fail here, where the message names the variable.
      #
      # NEXT_PUBLIC_SITE_URL is the value ci.yml promises "the deployment sets its own".
      #
      # PUBLIC_CLAIMS_MODE is deliberately absent, here and in Vercel. Setting it to "strict"
      # makes web/content/public/proof.ts throw at import while any claim, price, photo or
      # legal page is still a placeholder — it would fail every build today. PlaceholderBanner
      # keeps those honest meanwhile. Set it in Vercel's Production environment, not here, the
      # day the registry is clean, so the gate lives with the content decision.
      - name: Required production variables are present
        run: |
          set -euo pipefail
          file=.vercel/.env.production.local
          missing=()
          for v in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY NEXT_PUBLIC_SITE_URL; do
            # Not `=.+`: `vercel pull` writes every value double-quoted, so a variable defined
            # in Vercel with an EMPTY value lands here as KEY="" — two characters, which `.+`
            # happily matches. That is precisely the case this guard exists to catch. Require
            # a first character that is neither a quote nor whitespace.
            grep -qE "^${v}=\"?[^\"[:space:]]" "$file" || missing+=("$v")
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing or empty in Vercel's Production environment: ${missing[*]}."
            echo "::error::Add them under Project Settings -> Environment Variables, then re-run."
            exit 1
          fi
          # Read this one's VALUE back, not just its presence. A wrong NEXT_PUBLIC_SITE_URL is
          # not a 500 — it is correct-looking pages whose canonical URLs, sitemap entries and
          # email confirmation links all point somewhere the traveler cannot reach.
          site="$(grep -m1 '^NEXT_PUBLIC_SITE_URL=' "$file" | cut -d= -f2- | tr -d '"')"
          if [ "$site" != "$SITE_ORIGIN" ]; then
            echo "::error::NEXT_PUBLIC_SITE_URL is '$site', expected '$SITE_ORIGIN'."
            exit 1
          fi

      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          url="$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})"
          echo "Deployed $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # The step above proves the variables EXIST; this proves the running app can use them.
      # A proxy that throws returns 5xx on every path, and that is invisible from a green
      # build. Anything under 500 passes — a redirect to /login is a working app.
      - name: Smoke-test the deployment
        if: ${{ !inputs.dry_run }}
        env:
          # Optional. Vercel -> Settings -> Deployment Protection -> Protection Bypass for
          # Automation. Only needed while Deployment Protection is on.
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          hdr=()
          if [ -n "${BYPASS:-}" ]; then
            hdr=(-H "x-vercel-protection-bypass: $BYPASS")
          fi

          # Deployment Protection is on for this project: an unauthenticated request 302s to
          # vercel.com/sso-api and never reaches Next.js. That breaks this step in BOTH
          # directions — the 302 is under 500, so the status check below would pass without
          # ever exercising the app, and the robots.txt assertion would grep the SSO page and
          # fail a deploy that actually worked. Neither is acceptable in a step whose whole
          # job is to distinguish a green deploy from a working one, so detect the wall and
          # say which of the two fixes is needed rather than guessing.
          loc="$(curl -sS -o /dev/null -D - --max-time 20 "${hdr[@]}" \
                   "${{ steps.deploy.outputs.url }}/" | tr -d '\r' | grep -i '^location:' || true)"
          case "$loc" in
            *vercel.com/sso-api*)
              echo "::error::Deployment Protection intercepted the smoke test — the app was never reached."
              echo "::error::Either set the VERCEL_AUTOMATION_BYPASS_SECRET repo secret (Vercel ->"
              echo "::error::Settings -> Deployment Protection -> Protection Bypass for Automation),"
              echo "::error::or turn Deployment Protection off for production."
              exit 1
              ;;
          esac

          code="$(curl -sS -o /dev/null -w '%{http_code}' --retry 6 --retry-delay 5 \
                    --retry-all-errors "${hdr[@]}" "${{ steps.deploy.outputs.url }}/")"
          echo "GET / -> $code"
          if [ "$code" -ge 500 ]; then
            echo "::error::Deployment answered $code. A 5xx here is almost always a missing"
            echo "::error::NEXT_PUBLIC_SUPABASE_* var — see web/lib/env.ts."
            exit 1
          fi
          # The sharper assertion: web/app/robots.ts renders from env.siteUrl, so this reads
          # back the NEXT_PUBLIC_SITE_URL actually COMPILED INTO the bundle — not the one the
          # dashboard claims. The step above only proved what the dashboard says.
          curl -sS --retry 3 --retry-all-errors "${hdr[@]}" "$SITE_ORIGIN/robots.txt" \
            | grep -q "$SITE_ORIGIN/sitemap.xml" || {
              echo "::error::robots.txt does not carry $SITE_ORIGIN — the bundle was built"
              echo "::error::with a different NEXT_PUBLIC_SITE_URL."
              exit 1
            }

      # The split deploy's missing artifact. Migrations reach production via Supabase's
      # integration and leave no record in this repo; the frontend reaches production via the
      # step above. Neither knows about the other. This release is the one place a future
      # incident can read what shipped together, so it names the migrations by file rather
      # than assuming anyone will diff two branches at 2am.
      #
      # Date+sha, not semver: the three package.json versions already disagree (0.0.1 root,
      # 0.1.0 web) and inventing a bump ceremony here would only add a lie to the tag.
      - name: Tag and release what shipped
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          tag="v$(date -u +%Y.%m.%d)-$(git rev-parse --short HEAD)"
          previous="$(git describe --tags --abbrev=0 2>/dev/null || true)"

          # The first release has no predecessor, so list every migration rather than diffing.
          if [ -n "$previous" ]; then
            migrations="$(git diff --name-only --diff-filter=A "$previous"..HEAD \
                            -- supabase/migrations/ | sed 's|.*/|  - |')"
          else
            migrations="$(git ls-tree -r --name-only HEAD \
                            -- supabase/migrations/ | sed 's|.*/|  - |')"
          fi
          [ -n "$migrations" ] || migrations="  (none)"

          {
            echo "Frontend: ${{ steps.deploy.outputs.url }}"
            echo
            echo "### Migrations in this release"
            echo "Applied to production by Supabase's GitHub integration, not by this workflow."
            echo
            echo "$migrations"
          } > "$RUNNER_TEMP/notes.md"

          # The tag is date+sha, so a re-deploy of the same commit on the same UTC day
          # produces the SAME tag — and `gh release create` 422s on an existing one. Under
          # `set -e` that would redden a run whose deploy and smoke test had already passed,
          # leaving production updated with no record and a red X indistinguishable from a
          # failed deploy. The re-deploy path is exactly what workflow_dispatch is for, and
          # a CI "Re-run all jobs" fires this again on its own, so this is ordinary, not edge.
          # `gh release view` as an if-condition is exempt from set -e; a bare `create ||
          # edit` would instead swallow a genuine create failure (bad token, network) into an
          # edit attempt and lose which one broke.
          if gh release view "$tag" >/dev/null 2>&1; then
            # Same commit, so the migration list is unchanged by definition — append this
            # deploy rather than rewriting the record.
            gh release view "$tag" --json body -q .body > "$RUNNER_TEMP/old.md"
            {
              cat "$RUNNER_TEMP/old.md"
              echo
              echo "Re-deployed by run ${GITHUB_RUN_ID}: ${{ steps.deploy.outputs.url }}"
            } > "$RUNNER_TEMP/merged.md"
            gh release edit "$tag" --notes-file "$RUNNER_TEMP/merged.md"
          else
            gh release create "$tag" --target "$sha" --title "$tag" \
               --notes-file "$RUNNER_TEMP/notes.md" --generate-notes
          fi

      - name: Dry run — nothing was deployed
        if: ${{ inputs.dry_run }}
        run: |
          echo "Dry run complete. Proved: the Vercel link, the Root Directory, the three"
          echo "production env vars, and a successful monorepo build from the repo root."
          echo "Production was not modified."
