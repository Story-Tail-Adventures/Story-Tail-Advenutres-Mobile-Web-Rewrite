# Story-Tail Adventures — production frontend deploy + release record
#
# This workflow owns HALF a deployment. The other half — migrations and Edge Functions — is
# applied server-side by Supabase's GitHub integration when `production` moves, over its own
# OAuth connection. That split is why there is no `supabase link`, no `supabase db push` and
# no SUPABASE_* credential below: a database password that never enters GitHub cannot leak
# from GitHub. ci.yml's header says "Secrets enter only with the deploy workflow" — there is
# exactly one here, and it is Render's.
#
# Because the two halves run on separate machines with separate logs, the release cut at the
# end is the only place the whole of a deploy is written down together. That is what it is
# for; it is not decoration.
#
# ── WHY RENDER AND NOT VERCEL ────────────────────────────────────────────────────
#
# Vercel blocked the account on 2026-10-26 under its fair use guidelines, which restrict the
# Hobby plan to "non-commercial personal use only". This is a travel advisory's site and CRM.
# docs/RENDER-MIGRATION.md has the whole story. The Vercel half of this file is gone with it:
# no CLI pin, no link/pull dance, no prebuilt-output move.
#
# What replaces it is smaller, because Render builds from the repo itself. The one thing that
# got BETTER in the swap is worth naming: this deploys by `commitId`, so production runs the
# exact commit CI tested rather than whatever happens to be at the branch tip.
name: Deploy

on:
  # Not `push`. A push trigger races CI, so a commit that fails typecheck, the RLS isolation
  # tests or the PAN guard could reach users before CI has an opinion about it.
  #
  # This is also why render.yaml sets `autoDeploy: false`. Render cannot see GitHub Actions,
  # so if it watched the branch itself it would deploy on push and race CI exactly the way
  # this trigger exists to prevent. The API call below is the only thing that deploys.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [production]

  # Re-deploy the current tree without inventing an empty commit: a rolled-back deployment,
  # a rotated anon key, or a red CI job in a stack this deploy does not touch (an iOS klib
  # failure should not hold a web hotfix hostage).
  #
  # dry_run proves everything except the deploy itself: the credential, the service, the
  # production variables, and a real `next build` of this commit on the runner. Render builds
  # on its own machines as part of a deploy, so there is no remote build to stop halfway —
  # building here is the closest equivalent, and it exercises the same monorepo path.
  workflow_dispatch:
    inputs:
      dry_run:
        description: Verify and build, do not deploy
        type: boolean
        default: false

concurrency:
  # The `-dry` suffix keeps dry runs out of the real deploy queue. GitHub holds at most ONE
  # pending run per group and cancels the previous one, so a dispatched dry run sharing this
  # group would silently evict a deploy queued behind an in-progress one — and it would
  # report as "cancelled", not failed, so nothing would go red. On workflow_run,
  # `inputs.dry_run` is empty, so the suffix folds away and the push path's group is unchanged.
  group: deploy-production${{ inputs.dry_run && '-dry' || '' }}
  # Deliberately NOT cancel-in-progress, the opposite of ci.yml's concurrency block. Killing
  # this between the trigger and the poll does not stop the deploy Render has already started;
  # it only throws away the job that was watching it, leaving production changing with nothing
  # reporting on it and no release cut. Queue.
  cancel-in-progress: false

# contents: write is for the release and its tag, and is the only write this needs.
permissions:
  contents: write

env:
  NODE_VERSION: "22"

  # The one origin the whole deploy is measured against — the single place to change it.
  #
  # STILL A PLACEHOLDER, deliberately: the address is undecided (docs/RENDER-MIGRATION.md §8,
  # "`.onrender.com` or a real domain"). The guard below refuses to deploy until it is filled
  # in, which is the same protection SITE_ORIGIN has always had and exactly the case it was
  # written for.
  #
  # Whatever origin this names is crawlable — web/app/seo.ts serves `allow: "/"` — and
  # web/content/public/proof.ts still reports unverified claims, placeholder prices and
  # unlicensed photos. Those do not belong on the brand domain, least of all one with traffic.
  # So the Render-assigned URL is the right first value, and adventures.story-tail.com waits
  # for the content registry to be clean.
  SITE_ORIGIN: "https://REPLACE-ME.onrender.com"

  # Identify the service by its id, which is visible in the dashboard URL
  # (dashboard.render.com/web/srv-…) and is therefore checkable in a diff, on sight, without a
  # deploy. Not a secret.
  #
  # The lesson behind this being a literal rather than a GitHub secret is the one the Vercel
  # version of this file learned over seven runs: an opaque id stored as a secret cannot be
  # read back, so a wrong one is indistinguishable from a right one and every attempt costs a
  # full run to test. The step below prints the service this id actually resolves to.
  RENDER_SERVICE_ID: "REPLACE-ME"

jobs:
  render:
    name: Render production
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Three conditions, not one.
    #   conclusion  — workflow_run fires on completion, INCLUDING failure and cancellation.
    #   event       — ci.yml also runs on `pull_request`, so a PR opened from a branch that
    #                 happens to be named `production` carries head_branch == 'production'
    #                 straight past the `branches:` filter above.
    #   head_branch — belt and braces with that filter, which has a history of surprises.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'production')

    steps:
      # THE bug this workflow is one line away from. A workflow_run job runs the file from
      # the DEFAULT branch and defaults github.sha to the default branch's head — so a bare
      # checkout builds `dev` and ships it to production, silently, on every green CI run.
      # head_sha is the commit CI actually tested, and it is also what gets deployed: the
      # trigger below passes it as `commitId`.
      # fetch-depth: 0 because the release step diffs against the previous tag.
      # persist-credentials: false because the dry-run build executes this project's own
      # install and build — third-party code from node_modules with the workspace as cwd. The
      # default leaves a contents:write GITHUB_TOKEN in .git/config's extraheader for that
      # code to read. Nothing here needs authenticated git: the release step talks to the REST
      # API with GH_TOKEN, and the rest is local rev-parse / describe / diff.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      # The failure mode this repo has already shipped once: the draft of this file carried
      # `SUPABASE_PROJECT_ID: "your-supabase-project-ref-id"` for its whole life because
      # nothing complained. A placeholder that fails loudly is a placeholder; one that fails
      # quietly is a bug waiting for a deploy.
      - name: SITE_ORIGIN and RENDER_SERVICE_ID have been filled in
        run: |
          set -uo pipefail
          bad=0
          case "$SITE_ORIGIN" in
            *REPLACE-ME*)
              echo "::error::SITE_ORIGIN is still the placeholder. Set it to the service's"
              echo "::error::address (Render -> the service -> its URL, or the custom domain)."
              bad=1
              ;;
          esac
          case "$RENDER_SERVICE_ID" in
            *REPLACE-ME*|"")
              echo "::error::RENDER_SERVICE_ID is still the placeholder. Take it from the"
              echo "::error::dashboard URL: dashboard.render.com/web/srv-xxxxxxxx."
              bad=1
              ;;
          esac
          [ "$bad" -eq 0 ] || exit 1

      # A manual dispatch runs this file from whichever branch the UI dropdown had selected,
      # and checks that branch out. Shipping `dev` to production is one dropdown away; a dry
      # run from anywhere is harmless and stays allowed.
      - name: Refuse a manual deploy of a non-production ref
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run
        run: |
          if [ "${{ github.ref_name }}" != "production" ]; then
            echo "::error::Dispatch a real deploy from 'production'; got '${{ github.ref_name }}'."
            exit 1
          fi

      # Ask the API who the key is and what the id resolves to, before anything acts on them.
      #
      # The Vercel version of this step existed because a bad credential was reported
      # indirectly — "Could not retrieve Project Settings" — and seven runs were spent reading
      # that as a project problem. The same trap is here: a key without access and a wrong
      # service id both 404. One call tells them apart, and a GitHub secret cannot be read
      # back out, so this is the only way to see what is actually stored.
      #
      # Prints the service name and branch, never the key.
      - name: The Render key can see this service
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -uo pipefail
          if [ -z "${RENDER_API_KEY:-}" ]; then
            echo "::error::RENDER_API_KEY is not set. Create one at Render -> Account Settings"
            echo "::error::-> API Keys and add it as a repository secret."
            exit 1
          fi
          code="$(curl -sS -o "$RUNNER_TEMP/service.json" -w '%{http_code}' \
                    -H "Authorization: Bearer $RENDER_API_KEY" \
                    "https://api.render.com/v1/services/$RENDER_SERVICE_ID" || echo 000)"
          if [ "$code" != "200" ]; then
            echo "::error::Render answered HTTP $code for service $RENDER_SERVICE_ID."
            echo "::error::Response: $(head -c 300 "$RUNNER_TEMP/service.json" 2>/dev/null)"
            echo "::error::A 401 is the key; a 404 is the key lacking access OR a wrong"
            echo "::error::RENDER_SERVICE_ID. They look identical from the dashboard."
            exit 1
          fi
          echo "Service:  $(jq -r '.name // "?"' "$RUNNER_TEMP/service.json")"
          echo "Branch:   $(jq -r '.branch // "?"' "$RUNNER_TEMP/service.json")"
          echo "AutoDeploy: $(jq -r '.autoDeploy // "?"' "$RUNNER_TEMP/service.json")"
          # render.yaml turns this off so CI gates every deploy. If it is on, Render is also
          # deploying on push behind this workflow's back, which is the race the trigger above
          # exists to prevent — and the two would fight over which commit is live.
          if [ "$(jq -r '.autoDeploy // ""' "$RUNNER_TEMP/service.json")" = "yes" ]; then
            echo "::error::Auto-Deploy is ON for this service. render.yaml sets autoDeploy:"
            echo "::error::false so CI gates deploys; turn it off under Settings -> Build &"
            echo "::error::Deploy, or this workflow and Render will race each other."
            exit 1
          fi

      # The trap this step exists for: NO prerendered route reads NEXT_PUBLIC_SUPABASE_URL or
      # NEXT_PUBLIC_SUPABASE_ANON_KEY, so a build missing them is GREEN. Then web/lib/env.ts
      # throws inside the proxy (web/lib/supabase/middleware.ts) on the first real request and
      # every page 500s. Fail here, where the message names the variable.
      #
      # It matters more on Render than it did on Vercel, because every NEXT_PUBLIC_* value is
      # inlined at BUILD time: a variable added after the build is still missing from the
      # bundle until the next one, and nothing about the service looks wrong.
      #
      # PUBLIC_CLAIMS_MODE is deliberately absent, here and in Render. Setting it to "strict"
      # makes web/content/public/proof.ts throw at import while any claim, price, photo or
      # legal page is still a placeholder — it would fail every build today. PlaceholderBanner
      # keeps those honest meanwhile. Set it on the service, not here, the day the registry is
      # clean, so the gate lives with the content decision.
      - name: Required production variables are present
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -uo pipefail
          code="$(curl -sS -o "$RUNNER_TEMP/envvars.json" -w '%{http_code}' \
                    -H "Authorization: Bearer $RENDER_API_KEY" \
                    "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars?limit=100" \
                    || echo 000)"
          if [ "$code" != "200" ]; then
            echo "::error::Could not read the service's environment variables (HTTP $code)."
            echo "::error::Response: $(head -c 300 "$RUNNER_TEMP/envvars.json" 2>/dev/null)"
            exit 1
          fi
          # Names only, never values. The list is [{ envVar: { key, value } }, …].
          jq -r '.[].envVar.key' "$RUNNER_TEMP/envvars.json" | sort > "$RUNNER_TEMP/names.txt"
          missing=()
          for v in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY NEXT_PUBLIC_SITE_URL; do
            grep -qx "$v" "$RUNNER_TEMP/names.txt" || missing+=("$v")
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Missing from the service's environment: ${missing[*]}."
            echo "::error::Add them under the service -> Environment, then re-run."
            echo "Names present on the service:"
            sed 's/^/  /' "$RUNNER_TEMP/names.txt" || echo "  (none)"
            exit 1
          fi
          # Read this one's VALUE back, not just its presence. A wrong NEXT_PUBLIC_SITE_URL is
          # not a 500 — it is correct-looking pages whose canonical URLs, sitemap entries and
          # email confirmation links all point somewhere the traveler cannot reach.
          site="$(jq -r '.[].envVar | select(.key=="NEXT_PUBLIC_SITE_URL") | .value' \
                    "$RUNNER_TEMP/envvars.json")"
          if [ "$site" != "$SITE_ORIGIN" ]; then
            echo "::error::NEXT_PUBLIC_SITE_URL on the service is '$site', expected '$SITE_ORIGIN'."
            exit 1
          fi

      # Only on a dry run. A real deploy does not build here: Render builds the commit itself,
      # and building twice would prove nothing about the machine that matters while doubling
      # the chance of a false green from a runner-only difference.
      - uses: actions/setup-node@v7
        if: ${{ inputs.dry_run }}
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Dry run — build this commit without deploying
        if: ${{ inputs.dry_run }}
        env:
          # The build inlines this, so it has to match what the service would use.
          NEXT_PUBLIC_SITE_URL: ${{ env.SITE_ORIGIN }}
        run: |
          set -euo pipefail
          npm ci
          npm run build -w web

      # Deploy the commit CI tested, by sha. Without `commitId` Render takes the branch tip,
      # which is not necessarily what the workflow_run that triggered this was about.
      - name: Deploy
        id: deploy
        if: ${{ !inputs.dry_run }}
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "Deploying $sha"
          code="$(curl -sS -o "$RUNNER_TEMP/deploy.json" -w '%{http_code}' -X POST \
                    -H "Authorization: Bearer $RENDER_API_KEY" \
                    -H "Content-Type: application/json" \
                    -d "{\"commitId\":\"$sha\",\"clearCache\":\"do_not_clear\"}" \
                    "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys")"
          case "$code" in
            200|201|202) ;;
            *)
              echo "::error::Render refused the deploy (HTTP $code)."
              echo "::error::Response: $(head -c 400 "$RUNNER_TEMP/deploy.json" 2>/dev/null)"
              exit 1
              ;;
          esac
          id="$(jq -r '.id // empty' "$RUNNER_TEMP/deploy.json")"
          if [ -z "$id" ]; then
            echo "::error::Render accepted the deploy but returned no id; cannot follow it."
            echo "::error::Response: $(head -c 400 "$RUNNER_TEMP/deploy.json" 2>/dev/null)"
            exit 1
          fi
          echo "Deploy $id started"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      # Render's deploy is asynchronous, and a failed one does NOT roll back: the previous
      # version keeps serving. So "the API accepted it" says nothing about what is live, and
      # without this the release below would record a deploy that never went out.
      - name: Wait for it to go live
        if: ${{ !inputs.dry_run }}
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -uo pipefail
          deploy_id="${{ steps.deploy.outputs.id }}"
          # 20s x 75 = 25 minutes, inside the job's 30. Render suggests 10-30s to stay within
          # the API rate limit.
          for _ in $(seq 1 75); do
            status="$(curl -sS -H "Authorization: Bearer $RENDER_API_KEY" \
                        "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$deploy_id" \
                      | jq -r '.status // "unknown"')"
            echo "  status: $status"
            case "$status" in
              live)
                echo "Deploy $deploy_id is live."
                exit 0
                ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "::error::Deploy $deploy_id ended as '$status'. The previous version is"
                echo "::error::still serving. Build logs: https://dashboard.render.com/web/$RENDER_SERVICE_ID"
                exit 1
                ;;
            esac
            sleep 20
          done
          echo "::error::Deploy $deploy_id did not reach 'live' within 25 minutes."
          exit 1

      # The step above proves the deploy finished; this proves the running app can use its
      # configuration. A proxy that throws returns 5xx on every path, and that is invisible
      # from a successful build. Anything under 500 passes — a redirect to /login is a working
      # app.
      - name: Smoke-test the deployment
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          code="$(curl -sS -o /dev/null -w '%{http_code}' --retry 6 --retry-delay 5 \
                    --retry-all-errors "$SITE_ORIGIN/")"
          echo "GET / -> $code"
          if [ "$code" -ge 500 ]; then
            echo "::error::Deployment answered $code. A 5xx here is almost always a missing"
            echo "::error::NEXT_PUBLIC_SUPABASE_* var — see web/lib/env.ts."
            exit 1
          fi
          # The sharper assertion: web/app/robots.ts renders from env.siteUrl, so this reads
          # back the NEXT_PUBLIC_SITE_URL actually COMPILED INTO the bundle — not the one the
          # dashboard claims. The step above only proved what the dashboard says, and on
          # Render that gap is wider, because the value is inlined at build time and a
          # variable corrected after the last build is still wrong in what is serving.
          curl -sS --retry 3 --retry-all-errors "$SITE_ORIGIN/robots.txt" \
            | grep -q "$SITE_ORIGIN/sitemap.xml" || {
              echo "::error::robots.txt does not carry $SITE_ORIGIN — the bundle was built"
              echo "::error::with a different NEXT_PUBLIC_SITE_URL. Correct it on the service"
              echo "::error::and deploy again; a restart will not pick it up."
              exit 1
            }

      # The split deploy's missing artifact. Migrations reach production via Supabase's
      # integration and leave no record in this repo; the frontend reaches production via the
      # steps above. Neither knows about the other. This release is the one place a future
      # incident can read what shipped together, so it names the migrations by file rather
      # than assuming anyone will diff two branches at 2am.
      #
      # This used to tag date+sha and say so, because the package.json versions disagreed
      # (0.0.1 root, 0.1.0 web) and a bump ceremony over that would only have added a lie to
      # the tag. They agree now, and the root VERSION file is the one place that says which
      # build this is — so the tag leads with it and the date+sha stays on the end, where it
      # still does the work it was doing: one tag per commit per UTC day, which is what makes
      # the re-deploy branch below safe.
      #
      # VERSION is a semver PRERELEASE (0.0.1-alpha), and the release is cut with
      # --prerelease to match. That is not decoration either: `gh release list`, the repo's
      # releases page and the Latest badge all key off that flag. An alpha that presents
      # itself as a finished release is the kind of thing someone reads at 2am and believes.
      - name: Tag and release what shipped
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"

          # Same rule as SITE_ORIGIN above: a missing or empty VERSION fails here, loudly,
          # rather than tagging the first production deploy "v." and leaving someone to
          # work out which build that was.
          version="$(tr -d '[:space:]' < VERSION 2>/dev/null || true)"
          if [ -z "$version" ]; then
            echo "::error::VERSION at the repo root is missing or empty; nothing to tag."
            exit 1
          fi

          # v0.0.1-alpha.20260909.1a2b3c4 — valid semver, and the date+sha keeps one tag per
          # commit per UTC day so the re-deploy branch below still recognises its own work.
          tag="v${version}.$(date -u +%Y%m%d).$(git rev-parse --short HEAD)"
          previous="$(git describe --tags --abbrev=0 2>/dev/null || true)"

          # The first release has no predecessor, so list every migration rather than diffing.
          if [ -n "$previous" ]; then
            migrations="$(git diff --name-only --diff-filter=A "$previous"..HEAD \
                            -- supabase/migrations/ | sed 's|.*/|  - |')"
          else
            migrations="$(git ls-tree -r --name-only HEAD \
                            -- supabase/migrations/ | sed 's|.*/|  - |')"
          fi
          [ -n "$migrations" ] || migrations="  (none)"

          {
            echo "**${version}** — pre-release. Not release-grade; do not treat this as GA."
            echo
            echo "Frontend: $SITE_ORIGIN (Render deploy ${{ steps.deploy.outputs.id }})"
            echo
            echo "### Migrations in this release"
            echo "Applied to production by Supabase's GitHub integration, not by this workflow."
            echo
            echo "$migrations"
          } > "$RUNNER_TEMP/notes.md"

          # The tag is date+sha, so a re-deploy of the same commit on the same UTC day
          # produces the SAME tag — and `gh release create` 422s on an existing one. Under
          # `set -e` that would redden a run whose deploy and smoke test had already passed,
          # leaving production updated with no record and a red X indistinguishable from a
          # failed deploy. The re-deploy path is exactly what workflow_dispatch is for, and
          # a CI "Re-run all jobs" fires this again on its own, so this is ordinary, not edge.
          # `gh release view` as an if-condition is exempt from set -e; a bare `create ||
          # edit` would instead swallow a genuine create failure (bad token, network) into an
          # edit attempt and lose which one broke.
          if gh release view "$tag" >/dev/null 2>&1; then
            # Same commit, so the migration list is unchanged by definition — append this
            # deploy rather than rewriting the record.
            gh release view "$tag" --json body -q .body > "$RUNNER_TEMP/old.md"
            {
              cat "$RUNNER_TEMP/old.md"
              echo
              echo "Re-deployed by run ${GITHUB_RUN_ID}: Render deploy ${{ steps.deploy.outputs.id }}"
            } > "$RUNNER_TEMP/merged.md"
            gh release edit "$tag" --notes-file "$RUNNER_TEMP/merged.md"
          else
            gh release create "$tag" --target "$sha" --title "$tag" --prerelease \
               --notes-file "$RUNNER_TEMP/notes.md" --generate-notes
          fi

      - name: Dry run — nothing was deployed
        if: ${{ inputs.dry_run }}
        run: |
          echo "Dry run complete. Proved: the Render API key, the service id and its"
          echo "Auto-Deploy setting, the three production env vars, and a successful"
          echo "monorepo build of this commit. Production was not modified."
